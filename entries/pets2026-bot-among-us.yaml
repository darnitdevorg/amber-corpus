# Verified subset: the quantitative survey analysis in analysis.ipynb (paper Sections 4.3-4.4 and
# Appendix B): sample size, the before/after privacy-concern Wilcoxon test, the three Spearman tests and
# the Discord-WhatsApp Tukey HSD comparisons. Figures and the qualitative coding (code.csv) are excluded.
id: pets2026-bot-among-us
title: 'Bot Among Us: Exploring User Awareness and Privacy Concerns About Chatbots in Group Chats'
venue:
  name: PETS
  year: 2026
paper:
  url: https://petsymposium.org/popets/2026/popets-2026-0016.pdf
  doi: 10.56553/popets-2026-0016
artifact:
  url: https://github.com/csienslab/bot-among-us/tree/df1622ecaa2bf46f83d8153361a8b2abf7725a99
  clone: |
    git clone https://github.com/csienslab/bot-among-us.git artifact, then
    `git -C artifact checkout df1622ecaa2bf46f83d8153361a8b2abf7725a99` and run
    run.command from inside artifact/.
  ref_type: commit
  ref: df1622ecaa2bf46f83d8153361a8b2abf7725a99
  license: MIT
badges:
- available
- functional
- reproduced
resources:
  cpu_only: true
  ram_gb: 1
  disk_gb: 1
  runtime_minutes: 5
  docker: false
  network_required: true
  notes: |
    Artifact appendix (ARTIFACT-APPENDIX.md at the pinned commit): "No special hardware
    requirements", "Overall compute time: ~1 minute to execute all cells", "Disk space: ~3 GB
    for the Docker image + <10 MB for repo, data, and generated figures". Its evaluation step is
    "Kernel -> Restart & Run All" on analysis.ipynb. Badges: PoPETs 2026 proceedings page
    ("Artifact: Available, Functional, Reproduced") and https://secartifacts.github.io/pets2026/results.
    That secartifacts row links DOI 10.56553/popets-2026-0003, which is a different paper
    (PriVA-C); this paper is popets-2026-0016.

    Tested: every code cell of analysis.ipynb, run verbatim and in order in one Python namespace,
    on the bundled anonymized survey CSV (N=374). Code cells are numbered from 0 in notebook
    order, as the driver labels them. The only skipped cell is the final `%pip freeze` IPython
    magic, whose exact text is asserted. The claims are the paper's reported statistics:
    sample size, the before/after privacy-concern percentages and Wilcoxon signed-rank test
    (Sec. 4.4.1, Table 7), the significance pattern of the three Spearman tests (Sec. 4.3.2/4.4.1,
    Table 6) and the Discord-WhatsApp Tukey HSD p-values (App. B.3). Not tested: figures, the
    chi-square tests (the paper reports no statistic), and the qualitative coding in code.csv,
    which the appendix says is "not included in the analysis script".

    Native, no Docker. The appendix suggests jupyter/datascience-notebook:latest; run.command
    instead builds a local venv with pip --require-hashes from the wheels below. The top-level
    versions equal the authors' own `%pip freeze` (last notebook cell) and the paper's "All
    calculations were conducted using Scipy 1.11.3": numpy 1.26.4, pandas 2.3.1, scipy 1.11.3,
    statsmodels 0.14.0, patsy 0.5.3, matplotlib 3.8.0, seaborn 0.13.0, altair 5.1.2,
    ipython 8.16.1. Transitive dependencies are the cp312 wheels pip resolved on 2026-11-13.
    The authors ran Python 3.11.6 on aarch64; this run used Python 3.12.3 on x86_64.
    IPython is installed so that code cell 31's display(tukey_result.summary()) prints the Tukey
    tables to stdout; outside a kernel IPython's display() prints the object. The cells write
    their figures into the checkout's figures/ directory, as the notebook does.

    Prerequisites: Linux x86_64, git, Python 3.12 with venv, network access to PyPI.
    network_required covers git and PyPI acquisition only; the analysis itself is offline.
    No random seeds, resampling or timing apply. The "95% bootstrap CI" printed by code cell 40
    is a deterministic percentile interval of the paired differences ([-2, 3], as in Sec. 4.4.1).

    Paper-internal inconsistency, recorded before the run: Table 6 gives the message-metadata
    and group-metadata rows as rho 0.0389 / p 0.4527 and 0.1563 / p 0.0024, but Sec. 4.4.1 gives
    0.079 (p = 0.13) and 0.15 (p < 0.01). The rerun gives 0.0786 / 0.1292 and 0.1454 / 0.0048,
    matching the text. The claim uses the significance pattern (n.s., n.s., significant), which
    Table 6 and the text share. The message-content row (-0.0577, p 0.2654) agrees in both.
    The paper prints effect size r = 0.308; the notebook gives -0.30877, so 0.308 is a
    truncation. It is not claimed.

    First run on 2026-11-13 (clean clone, Python 3.12.3 venv): exit 0 in 46.3 s wall,
    275680 KiB GNU time maximum RSS under a 4 GiB address-space cap; all 73 code cells ran.
    The regenerated stdout equals the authors' saved notebook stdout except that the Tukey
    tables appear as text and one Spearman p-value differs in its last digit
    (0.00484501460104667 vs 0.0048450146010466716). A separate validator recomputed the
    claims from the raw CSV: counts and percentages with the csv module, Wilcoxon and
    Spearman from ranks, and Tukey HSD with scipy.stats.tukey_hsd instead of statsmodels.
    It reused only the authors' grading key (code cells 0-24) for the QID28-30 scores, and it
    agrees on all nine claims. It also reproduces all nine App. B.3 platform means (58/45/36%,
    3.36/3.33/2.95, 3.29/2.93/2.60), which the notebook does not print as text.

    The literal run.command, parsed from this YAML, passed from a second fresh clone on
    2026-11-13 with no pip cache: exit 0 in 55.3 s wall including PyPI downloads, 275040 KiB
    maximum RSS, about 541 MB on disk with the venv. versions.log, run.log, run.stderr.log and
    metrics.json were byte-identical to the first run. Every measure regex replays to
    REPRODUCED. The checker rejected 25 incomplete or invalid fixtures: missing, empty or
    truncated logs, a missing completion marker, Traceback or Error on stderr, altered
    platform counts, removed, reordered or altered Tukey rows or tables, altered or missing
    Spearman results, disagreeing Wilcoxon runs, an altered interval, and altered or
    duplicated Likert tables. A wrong claim value with intact structure is written to
    metrics.json and judged NOT_REPRODUCED. A wrong commit or an edited input file stops the
    command before amber-bot/ is created; a different scipy version fails the versions check.
    The baseline below is from the fresh literal-command run.
role: positive
expected_verdict: REPRODUCED
claims:
- metric: valid_participants
  threshold: == 374
  unit: participants
  source: Paper Sections 3.3 and 4 ("We collected valid responses from 374 participants"),
    https://petsymposium.org/popets/2026/popets-2026-0016.pdf
  measurement_protocol: 'Sum of the per-platform counts printed by the notebook (code cell 8, QID5 value_counts)
    for the bundled "Chatbot User Study Cleaned.csv". The checker also requires the paper''s split WhatsApp 244,
    Discord 83, Telegram 40, Viber 6, LINE 1 (Sec. 4).'
  expected_verdict: REPRODUCED
  notes: Establishes that the released dataset is the paper's full valid sample, not a subset.
  measure:
    file: amber-bot/metrics.json
    regex: '"valid_participants": ([0-9]+)'
- metric: concern_before_pct
  threshold: == 64.3
  unit: percent of respondents (1 dp)
  source: Paper Section 4.4.1 ("Initially, 64.3% somewhat or strongly agreed with the statement")
  measurement_protocol: 'Discord users excluded (n = 291, as in Sec. 4.4.1). Somewhat agree + Strongly agree share of
    QID83 (the privacy-concern statement asked before the permissions are shown), from the percentage table the
    notebook prints (code cell 50), rounded to 1 dp. The checker requires the printed counts to sum to 291 and the
    Discord-included table (n = 374) to give 60.4 -> 68.2, as App. B.4 states.'
  expected_verdict: REPRODUCED
  notes: Before half of the paired privacy-concern comparison.
  measure:
    file: amber-bot/metrics.json
    regex: '"concern_before_pct": ([0-9.]+)'
- metric: concern_after_pct
  threshold: == 73.2
  unit: percent of respondents (1 dp)
  source: Paper Section 4.4.1 ("Afterward, this rose to 73.2%")
  measurement_protocol: 'Same table and population as concern_before_pct, for QID33 (the same statement asked after
    the chatbot permissions are shown), rounded to 1 dp. Strongly agree must also rise from 27.1 to 37.5 (Sec. 4.4.1).'
  expected_verdict: REPRODUCED
  notes: After half of the paired privacy-concern comparison.
  measure:
    file: amber-bot/metrics.json
    regex: '"concern_after_pct": ([0-9.]+)'
- metric: wilcoxon_statistic
  threshold: == 2261.5
  unit: Wilcoxon W
  source: Paper Appendix B.6, Table 7 ("Test Statistic 2261.5")
  measurement_protocol: 'scipy.stats.wilcoxon on the Likert-coded (1-5) QID83 vs QID33 pairs for the 291 non-Discord
    respondents, as printed by code cell 38 (and identically by code cell 40). Default zero_method, two-sided.'
  expected_verdict: REPRODUCED
  notes: The test behind the paper's claim that concern rises after learning chatbot permissions.
  measure:
    file: amber-bot/metrics.json
    regex: '"wilcoxon_statistic": ([0-9.]+)'
- metric: wilcoxon_p
  threshold: < 0.001
  unit: p-value
  source: Paper Section 4.4.1 ("A Wilcoxon signed-rank test showed that the change in concerns exists (p < 0.001")
  measurement_protocol: 'p-value printed with wilcoxon_statistic (code cell 38). The Discord-included test (code cell 51)
    must also give p < 0.001 (App. B.4).'
  expected_verdict: REPRODUCED
  notes: Significance of the before/after change at the paper's alpha (0.05, two-tailed); the paper reports p < 0.001.
  measure:
    file: amber-bot/metrics.json
    regex: '"wilcoxon_p": ([0-9.e-]+)'
- metric: spearman_significant_questions
  threshold: == 1
  unit: significant Spearman tests (of 3)
  source: Paper Sections 4.3.2/4.4.1 and Appendix B.6 Table 6 (n.s., n.s., significant at p < 0.05)
  measurement_protocol: 'Spearman correlation of self-reported knowledge (QID27, coded 1-5) with the graded scores for
    message type (QID28), message metadata (QID29) and group metadata (QID30), all 374 respondents, as printed by
    code cells 34-36. Count of tests with p < 0.05. The checker also requires the Sec. 4.4.1 text values: rho -0.058
    (p 0.27), 0.079 (p 0.13), 0.15 (p < 0.01).'
  expected_verdict: REPRODUCED
  notes: Self-reported knowledge does not track actual understanding, except for group metadata. Table 6 rows 2-3
    print different coefficients from the text; see resources.notes.
  measure:
    file: amber-bot/metrics.json
    regex: '"spearman_significant_questions": ([0-9]+)'
- metric: tukey_discord_whatsapp_q1_p
  threshold: == 0.0011
  unit: Tukey HSD adjusted p-value (4 dp)
  source: Paper Appendix B.3 ("the difference between Discord and WhatsApp is statistically significant (p = 0.0011)")
  measurement_protocol: 'statsmodels MultiComparison(...).tukeyhsd(alpha=0.05) on the QID28 (message type) scores of
    the WhatsApp, Discord and Telegram respondents (code cell 31); p-adj of the Discord-WhatsApp row of the printed
    table. Each of the three tables must have exactly the pairs Discord-Telegram, Discord-WhatsApp, Telegram-WhatsApp,
    and Discord-Telegram here must be 0.3575 (App. B.3).'
  expected_verdict: REPRODUCED
  notes: Discord users, whose platform officially supports chatbots, understand chatbot message access better than
    WhatsApp users.
  measure:
    file: amber-bot/metrics.json
    regex: '"tukey_discord_whatsapp_q1_p": ([0-9.]+)'
- metric: tukey_discord_whatsapp_q2_p
  threshold: == 0.0372
  unit: Tukey HSD adjusted p-value (4 dp)
  source: Paper Appendix B.3 ("The only statistically significant difference was between Discord and WhatsApp (p = 0.0372)")
  measurement_protocol: As tukey_discord_whatsapp_q1_p, for the QID29 (message metadata) scores (second printed table).
  expected_verdict: REPRODUCED
  notes: Same platform difference for message metadata.
  measure:
    file: amber-bot/metrics.json
    regex: '"tukey_discord_whatsapp_q2_p": ([0-9.]+)'
- metric: tukey_discord_whatsapp_q3_p
  threshold: < 0.0001
  unit: Tukey HSD adjusted p-value (4 dp)
  source: Paper Appendix B.3 ("only the difference between Discord and WhatsApp reached statistical significance (p < 0.0001)")
  measurement_protocol: As tukey_discord_whatsapp_q1_p, for the QID30 (group metadata) scores (third printed table).
    statsmodels prints p-adj to 4 dp, so a value below 0.00005 reads 0.0.
  expected_verdict: REPRODUCED
  notes: Same platform difference for group metadata.
  measure:
    file: amber-bot/metrics.json
    regex: '"tukey_discord_whatsapp_q3_p": ([0-9.]+)'
