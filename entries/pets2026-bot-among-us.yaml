    set -eu
    test "$(git rev-parse HEAD)" = df1622ecaa2bf46f83d8153361a8b2abf7725a99
    git diff --quiet HEAD -- analysis.ipynb 'Chatbot User Study Cleaned.csv' question_id_mapping.csv
    mkdir amber-bot
    python3 -m venv amber-bot/venv
    cat > amber-bot/requirements.txt <<'REQ'
