    REQ
    amber-bot/venv/bin/pip install --quiet --no-input --only-binary=:all: --require-hashes -r amber-bot/requirements.txt
    amber-bot/venv/bin/python -c "import numpy, pandas, scipy, statsmodels, IPython; print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'scipy', scipy.__version__, 'statsmodels', statsmodels.__version__, 'ipython', IPython.__version__)" > amber-bot/versions.log
    grep -Fx 'numpy 1.26.4 pandas 2.3.1 scipy 1.11.3 statsmodels 0.14.0 ipython 8.16.1' amber-bot/versions.log
    MPLBACKEND=Agg MPLCONFIGDIR=amber-bot/mpl amber-bot/venv/bin/python - > amber-bot/run.log 2> amber-bot/run.stderr.log <<'RUN'
    import json
    code = [''.join(c['source']) for c in json.load(open('analysis.ipynb'))['cells'] if c['cell_type'] == 'code']
    assert code[-2:] == ['%pip freeze', ''], 'unexpected final cells'
    ns = {'__name__': '__main__'}
    for i, src in enumerate(code[:-2]):  # every code cell before the %pip freeze magic, verbatim and in order
        exec(compile(src, 'analysis.ipynb code cell %d' % i, 'exec'), ns)
    print('AMBER-RUN-COMPLETE', len(code) - 2)
    RUN
    python3 -I - <<'CHECK' > amber-bot/metrics.json
    import json, re
    log, err = open('amber-bot/run.log').read(), open('amber-bot/run.stderr.log').read()
    assert log.endswith('AMBER-RUN-COMPLETE 73\n') and not re.search(r'Traceback|Error', err), 'incomplete run'
    n = dict(re.findall(r'^(\w+) +(\d+)$', re.search(r'^QID5\n(.*?)\nName: count', log, re.S | re.M)[1], re.M))
    assert n == {'WhatsApp': '244', 'Discord': '83', 'Telegram': '40', 'Viber': '6', 'LINE': '1'}, 'platform counts'
    tukey = []
    for part in log.split('Multiple Comparison of Means - Tukey HSD, FWER=0.05')[1:]:
        rows = re.findall(r'^ ?(\w+) +(\w+) +-?[\d.]+ +([\d.]+) +-?[\d.]+ +-?[\d.]+ +(?:True|False)$', part.split('\n-----', 2)[1], re.M)
        assert [r[:2] for r in rows] == [('Discord', 'Telegram'), ('Discord', 'WhatsApp'), ('Telegram', 'WhatsApp')], 'Tukey pairs'
        tukey.append({r[0] + '-' + r[1]: float(r[2]) for r in rows})
    assert len(tukey) == 3 and tukey[0]['Discord-Telegram'] == 0.3575, 'three Tukey tables'
    sp = [(float(r), float(p)) for r, p in re.findall(r'Spearman’s correlation coefficient: (\S+)\np-value: (\S+)\n', log)]
    assert len(sp) == 3 and [round(r, 3) for r, _ in sp[:2]] == [-0.058, 0.079] and [round(p, 2) for _, p in sp[:2]] == [0.27, 0.13], 'Spearman'
    assert round(sp[2][0], 2) == 0.15 and sp[2][1] < 0.01, 'Spearman group metadata'
    wx = [(float(w), float(p)) for w, p in re.findall(r'Wilcoxon signed-rank test statistic: (\S+)\np-value: (\S+)\n', log)]
    assert len(wx) == 3 and wx[0] == wx[1] and wx[2][1] < 0.001, 'Wilcoxon (n=291 twice, n=374 once)'
    assert log.count('95% bootstrap CI for median difference: [-2.000, 3.000]\n') == 1, 'paired-difference interval'
    tables = [dict((l[:27].strip(), (float(l.split()[-2]), float(l.split()[-1]))) for l in b.splitlines())
              for b in re.findall(r'^ +QID33 +QID83\n((?:.+\n){5})', log, re.M)]
    assert len(tables) == 4 and [round(sum(v[1] for v in t.values())) for t in tables] == [291, 100, 374, 100], 'Likert tables'
    agree = lambda t, i: round(t['Somewhat agree'][i] + t['Strongly agree'][i], 1)
    assert [round(tables[1]['Strongly agree'][i], 1) for i in (1, 0)] == [27.1, 37.5] and [agree(tables[3], i) for i in (1, 0)] == [60.4, 68.2], 'coverage %'
