  - path: amber-shuffle/table2.stdout.log
    sha256: 90df8c837622cf398a8d9ec1cbb632b37b8191279ce95108cbca01973ef2950a
  - path: amber-shuffle/table2.stderr.log
    sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  - path: amber-shuffle/table2_with_p95.csv
