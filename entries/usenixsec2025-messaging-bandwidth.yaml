    (root/'amber-tools/run_suite.py').write_text(r'''"""Run the two frozen CLI cases and their two planned raw-count API replays."""
    import datetime
    import hashlib
    import json
    import os
    from pathlib import Path
    import subprocess
    import sys
    import time

    artifact = Path.cwd()
    out = artifact/'amber-messaging'
    out.mkdir(exist_ok=False)
    target = Path(os.environ['AMBER_MESSAGING_TARGET']).resolve()
    cases = ['opp-uni-kem','uni-kem']
    records = []

    def run(label,command,stdout_path):
        started = datetime.datetime.now(datetime.timezone.utc).isoformat()
        then = time.monotonic()
        with stdout_path.open('xb') as stdout,(out/(label+'.stderr.log')).open('xb') as stderr:
            p = subprocess.run(['/usr/bin/time','-v','-o',str(out/(label+'.resources.txt')),'--',*command],stdout=stdout,stderr=stderr)
        record = dict(label=label,command=command,started_at=started,finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),runtime_seconds=time.monotonic()-then,exit_status=p.returncode)
        records.append(record)
        (out/'commands.json').write_text(json.dumps(records,indent=2)+'\n')
        print(json.dumps(record),flush=True)
        if p.returncode: raise RuntimeError('frozen command failed; no retry')

    for protocol in cases:
