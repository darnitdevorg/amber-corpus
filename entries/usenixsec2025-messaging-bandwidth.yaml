    (root/'amber-tools/entry_monitor.py').write_text(r'''import datetime
    import hashlib
    import json
    import os
    from pathlib import Path
    import resource
    import signal
    import subprocess
    import sys
    import time

    root=Path.cwd()
    cache=Path(os.environ['CARGO_HOME']).resolve(strict=True)
    assert cache.is_dir() and root!=cache and root not in cache.parents
    build=root/'amber-build'
    roots=[root,cache] if cache not in root.parents else [cache]
    memory=1536*1024**2
    storage=1024**3
    seconds=900

    def size():
        return sum(p.stat().st_size for base in roots for p in base.rglob('*') if p.is_file())

    def group_memory(group):
        rss=swap=0
        for p in Path('/proc').iterdir():
            if not p.name.isdecimal():continue
            try:
                if int((p/'stat').read_text().rsplit(')',1)[1].split()[2])!=group:continue
                for line in (p/'status').read_text().splitlines():
                    if line.startswith('VmRSS:'):rss+=int(line.split()[1])*1024
                    elif line.startswith('VmSwap:'):swap+=int(line.split()[1])*1024
            except (FileNotFoundError,ProcessLookupError,PermissionError):pass
        return rss,swap

    def limits():
        for key,value in [(resource.RLIMIT_AS,memory),(resource.RLIMIT_FSIZE,32*1024**2),(resource.RLIMIT_CPU,seconds),(resource.RLIMIT_CORE,0)]:
            resource.setrlimit(key,(value,value))

    available=next(int(l.split()[1])*1024 for l in Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:'))
    disk=os.statvfs(root)
    assert available>=3*1024**3 and disk.f_bavail*disk.f_frsize>=3*1024**3,'start resource gate'
    assert size()<storage
    started=datetime.datetime.now(datetime.timezone.utc).isoformat()
    then=time.monotonic();reason=None;peak_rss=peak_swap=peak_total=peak_disk=0
    with (build/'driver.stdout.log').open('xb') as stdout,(build/'driver.stderr.log').open('xb') as stderr:
        proc=subprocess.Popen(['/usr/bin/time','-v','-o',str(build/'driver.resources.txt'),'--','python3','-I',str(root/'amber-tools/entry_driver.py')],stdout=stdout,stderr=stderr,start_new_session=True,preexec_fn=limits)
        tick=0
        while proc.poll() is None:
            rss,swap=group_memory(proc.pid)
            peak_rss=max(peak_rss,rss);peak_swap=max(peak_swap,swap);peak_total=max(peak_total,rss+swap)
            if rss+swap>=memory:reason='aggregate_memory_limit'
            elif time.monotonic()-then>=seconds:reason='wall_timeout'
            if tick%10==0:
                used=size();peak_disk=max(peak_disk,used)
                if used>=storage:reason='storage_limit'
            if reason:
                os.killpg(proc.pid,signal.SIGTERM)
                try:proc.wait(timeout=2)
                except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL)
                break
            tick+=1;time.sleep(0.1)
        status=proc.wait()
    metadata=dict(started_at=started,finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),runtime_seconds=time.monotonic()-then,exit_status=status,limit_reason=reason,peak_aggregate_rss_bytes=peak_rss,peak_aggregate_swap_bytes=peak_swap,peak_aggregate_rss_plus_swap_bytes=peak_total,peak_workspace_and_cache_bytes=max(peak_disk,size()),sample_interval_seconds=0.1,storage_sample_interval_seconds=1,limits=dict(address_space_bytes=memory,aggregate_rss_plus_swap_bytes=memory,workspace_and_cache_bytes=storage,per_capture_file_bytes=32*1024**2,wall_seconds=seconds,per_process_cpu_seconds=seconds))
    (build/'capture.json').write_text(json.dumps(metadata,indent=2)+'\n')
    assert status==0 and reason is None,'incomplete bounded command; preserve captures and stop'
    sys.path.insert(0,str(root/'amber-tools'))
    from validate import validate
    from validate_pattern import validate_pattern
    out=root/'amber-messaging'
    metrics=validate_pattern(validate(out),out/'pattern.csv',out/'pattern-command.json')
    manifest=json.loads((root/'amber-tools/source-manifest.json').read_text())
    assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==h for p,h in manifest.items()),'original input changed'
    metrics['original_files_unchanged']=len(manifest)
    (out/'metrics.json').write_text(json.dumps(metrics,indent=2)+'\n')
    print(json.dumps(metrics,indent=2))
    ''')
    (root/'amber-tools/source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
    (root/'amber-build/tool-versions.json').write_text(json.dumps({str(cmd):subprocess.check_output(cmd,text=True) for cmd in [['rustc','--version','--verbose'],['cargo','--version'],['gcc','--version'],['python3','--version']]},indent=2)+'\n')
    exec(compile((root/'amber-tools/entry_monitor.py').read_text(),str(root/'amber-tools/entry_monitor.py'),'exec'))
    PY
