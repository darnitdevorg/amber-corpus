    tools=root/'amber-tools'
    build=root/'amber-build'
    env=os.environ.copy()
    for k in list(env):
        if k.startswith(('RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTC_WRAPPER','RUSTC_WORKSPACE_WRAPPER','LIBCRUX_','CARGO_PROFILE_')):
            del env[k]
    rustc=subprocess.check_output(['rustup','which','rustc'],text=True).strip()
    cargo=subprocess.check_output(['rustup','which','cargo'],text=True).strip()
    env.update(CARGO_TARGET_DIR=str(root/'.amber-target'),CARGO_NET_OFFLINE='true',
               CARGO_BUILD_JOBS='1',CARGO_PROFILE_RELEASE_CODEGEN_UNITS='1',
               CARGO_INCREMENTAL='0',RAYON_NUM_THREADS='1',
               RUSTFLAGS='-C link-arg=-Wl,--threads=1',RUSTC=rustc,
               TMPDIR=str(build/'tmp'),AMBER_MESSAGING_TARGET=str(root/'.amber-target'))
    (build/'tmp').mkdir()
    (build/'environment.json').write_text(json.dumps({k:v for k,v in env.items() if k.startswith(('CARGO_','RUSTC','RUSTFLAGS','RAYON_','TMPDIR'))},indent=2)+'\n')
    cmd=[cargo,'build','--release','--locked','--offline','--jobs','1','--bin','usenix2025sims','--example','amber_counts','--example','amber_pattern']
    start=time.monotonic()
    with (build/'stdout.log').open('xb') as stdout,(build/'stderr.log').open('xb') as stderr:
        result=subprocess.run(['/usr/bin/time','-v','-o',str(build/'resources.txt'),'--',*cmd],env=env,stdout=stdout,stderr=stderr)
    (build/'command.json').write_text(json.dumps(dict(command=cmd,exit_status=result.returncode,runtime_seconds=time.monotonic()-start),indent=2)+'\n')
    assert result.returncode==0,'bounded offline build failed'
    subprocess.run(['python3','-I',str(tools/'run_suite.py')],env=env,check=True)
    out=root/'amber-messaging'
    cmd=[str(root/'.amber-target/release/examples/amber_pattern')]
    with (out/'pattern.csv').open('xb') as stdout,(out/'pattern.stderr.log').open('xb') as stderr:
        result=subprocess.run(['/usr/bin/time','-v','-o',str(out/'pattern.resources.txt'),'--',*cmd],stdout=stdout,stderr=stderr)
    (out/'pattern-command.json').write_text(json.dumps(dict(command=cmd,exit_status=result.returncode),indent=2)+'\n')
    assert result.returncode==0,'sampling audit failed'
    ''')
