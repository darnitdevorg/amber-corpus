    (root/'examples/amber_pattern.rs').write_text(r'''// Count state-change opportunities independently of either CKA protocol.
    use rand::{rngs::StdRng, SeedableRng};
    use usenix2025sims::test::{basic_messaging_behavior::BasicMessagingBehavior,
        messaging_behavior::{MessagingBehavior, Command, Agent}};
    fn main() {
        let mut behavior = BasicMessagingBehavior::new(0.2, 0.2, 1.0);
        let mut rng = StdRng::seed_from_u64(43);
        let mut pending = [false; 2];
        let mut sent = [0usize; 2];
        let mut received = [0usize; 2];
        let mut changed = [0usize; 2];
        for _tick in 0..100000 {
            let mut tick_changed = [false; 2];
            for command in behavior.next_commands(&mut rng) {
                match command {
                    Command::ReceiveAll(agent) => {
                        let p = if agent == Agent::Alex {0} else {1};
                        if pending[p] {received[p] += 1; tick_changed[p] = true;}
                        pending[p] = false;
                    },
                    Command::Send(agent) => {
                        let p = if agent == Agent::Alex {0} else {1};
                        sent[p] += 1; tick_changed[p] = true; pending[1-p] = true;
                    },
                    Command::Receive(_) => panic!("unexpected command in selected behavior"),
                }
            }
            for p in 0..2 {if tick_changed[p] {changed[p] += 1;}}
        }
        println!("party,send_events,nonempty_receive_events,state_change_timesteps,candidate_snapshots");
        for p in 0..2 {
            println!("{},{},{},{},{}", if p==0 {"A"} else {"B"}, sent[p], received[p], changed[p], sent[p]+received[p]);
        }
    }
    ''')
