  url: https://zenodo.org/records/15571277
  clone: Download https://zenodo.org/api/records/15571277/files/ADJKS25_Artifact.zip/content as ADJKS25_Artifact.zip
    into a fresh working directory; run.command verifies its SHA-256 and extracts it.
  ref_type: doi
