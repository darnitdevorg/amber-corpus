    (root/'amber-tools/validate.py').write_text(r'''"""Independent integer-count validation, including every original CSV bin/statistic."""
    import csv
    from fractions import Fraction
    import json
    import math
    from pathlib import Path
    import sys

    def rows(path):
        with path.open(newline='') as f:
            return list(csv.reader(f))

    def close(actual,expected):
        return math.isfinite(actual) and abs(actual-expected) <= 8*math.ulp(expected)

    def validate(out):
        commands=json.loads((out/'commands.json').read_text())
        cases=['opp-uni-kem','uni-kem']
        assert [x['label'] for x in commands]==['cli-'+p for p in cases]+['counts-'+p for p in cases]
        assert all(x['exit_status']==0 and x['runtime_seconds']>0 for x in commands)
        expected_tail=['--fnamebase','amber-messaging/run','--numsteps','100000','--balance','0.5','--windowpp','50','--varpp','2']
        for i,p in enumerate(cases):
            assert commands[i]['command'][1:]==expected_tail+[p,'balanced','fs-rkem','hist','small']
            assert commands[i+2]['command'][1:]==[p]
        data={};fractions={}
        for protocol,short in [('opp-uni-kem','oppunikem'),('uni-kem','unikem')]:
            raw=rows(out/('counts-'+protocol+'.csv'))
            assert raw.pop(0)==['num_exposed','count_A','count_B']
            assert raw and all(len(row)==3 and all(s.isdecimal() for s in row) for row in raw)
            raw=[[int(v) for v in row] for row in raw]
            assert [v[0] for v in raw]==list(range(len(raw)))
            assert raw[-1][1]+raw[-1][2]>0
            n=[sum(row[i] for row in raw) for i in [1,2]]
            assert all(0 < v <= 400000 for v in n)
            hist=rows(out/f'run_bal_{short}_hist.csv')
            assert hist.pop(0)==['num exposed','freq exposed by a','freq exposed by b','cumulative exposed by a',' cumulative exposed by b','']
            assert len(hist)==len(raw)
            cumulative=[0,0]
            for original,counts in zip(hist,raw):
                assert len(original)==6 and original[-1]=='' and original[0]==str(counts[0])
                expected=[]
                for party in [0,1]:
                    cumulative[party]+=counts[party+1]
                    expected.append(counts[party+1]/n[party])
                expected += [cumulative[p]/n[p] for p in [0,1]]
                actual=[float(v) for v in original[1:5]]
                assert all(math.isfinite(v) and 0<=v<=1 for v in actual)
                assert actual==expected
            assert cumulative==n
            stats=rows(out/f'run_bal_{short}_stats.csv')
            assert stats.pop(0)==['compromised party','mean',' stddev',' min','p10','p20','p30','p40','p50','p60','p70','p80','p90','max']
            assert len(stats)==2 and [row[0] for row in stats]==['A','B']
            data[protocol]={};fractions[protocol]={}
            for party,label in enumerate(['A','B']):
                f=party+1;count=n[party]
                total=sum(c[0]*c[f] for c in raw)
                squares=sum(c[0]*c[0]*c[f] for c in raw)
                mean=Fraction(total,count);variance=Fraction(squares,count)-mean*mean
                assert variance>0
                mean_f=total/count;sd=math.sqrt(squares/count-mean_f*mean_f)
                assert len(stats[party])==14
                assert close(float(stats[party][1]),mean_f) and close(float(stats[party][2]),sd)
                assert close(float(stats[party][1]),float(mean)) and close(float(stats[party][2]),math.sqrt(float(variance)))
                support=[c[0] for c in raw if c[f]>0]
                quantiles=[support[0]]
                for q in range(1,10):
                    cumulative_count=0
                    for c in raw:
                        cumulative_count+=c[f]
                        if cumulative_count>(count*q)//10:
                            quantiles.append(c[0]);break
                quantiles.append(support[-1])
                assert [int(s) for s in stats[party][3:]]==quantiles
                data[protocol][label]=dict(samples=count,bins=len(raw),sum_exposed=total,sum_squared_exposed=squares,mean=float(mean),population_variance=float(variance),stddev=math.sqrt(float(variance)),deciles=quantiles)
                fractions[protocol][label]=(mean,variance)
        opp=fractions['opp-uni-kem']['A'];plain=fractions['uni-kem']['A']
        assert opp[0]<plain[0] and opp[1]<plain[1], 'frozen internal directional consistency failed'
        return dict(expected_verdict='NOT_COMPARABLE',role='not_comparable',cases=2,cli_runs=2,planned_count_api_replays=2,actual_timesteps_per_run=100000,paper_timesteps_per_run=1000000,actual_send_probability_per_party=0.2,paper_send_probability_per_party=0.4,message_pattern_seed=43,chunk_bytes=32,party_A_mean_ratio=float(opp[0]/plain[0]),party_A_variance_ratio=float(opp[1]/plain[1]),metrics=data,scope='Original artifact 32-byte primary-primary subset; different paper horizon and send probability; no paper reproduction or failure claim')

    if __name__=='__main__':
        result=validate(Path(sys.argv[1]));print(json.dumps(result,indent=2))
    ''')
    assert not (root/'amber-tools/validate_pattern.py').exists()
    (root/'amber-tools/validate_pattern.py').write_text(r'''import csv
    import json
    from pathlib import Path

    def validate_pattern(metrics, csv_path, metadata_path):
        metadata=json.loads(Path(metadata_path).read_text())
        assert metadata['exit_status']==0
        assert Path(metadata['command'][-1]).name=='amber_pattern'
        with Path(csv_path).open(newline='') as f:
            reader=csv.reader(f);header=next(reader);records=list(reader)
        assert header==['party','send_events','nonempty_receive_events','state_change_timesteps','candidate_snapshots']
        assert len(records)==2 and [r[0] for r in records]==['A','B']
        result={}
        for r in records:
            assert len(r)==5 and all(v.isdecimal() for v in r[1:])
            sent,received,changed,candidate=map(int,r[1:])
            assert 0<sent<=100000 and 0<received<=100000
            assert max(sent,received)<=changed<=100000
            assert changed<candidate==sent+received<=200000
            for protocol in ['opp-uni-kem','uni-kem']:
                retained=metrics['metrics'][protocol][r[0]]['samples']
                assert changed<retained<=candidate, 'event-sample count must exceed distinct changed ticks'
            result[r[0]]=dict(send_events=sent,nonempty_receive_events=received,state_change_timesteps=changed,candidate_snapshots=candidate,ticks_with_both_send_and_receive=candidate-changed)
        metrics['sampling_audit']=result
        metrics['scope']+='; additionally, retained event snapshots exceed distinct state-changing ticks, demonstrating different sampling weights from the per-timestep paper description'
        return metrics
    ''')
