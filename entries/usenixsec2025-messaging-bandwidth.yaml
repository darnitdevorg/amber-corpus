id: usenixsec2025-messaging-bandwidth
title: 'How to Compare Bandwidth Constrained Two-Party Secure Messaging Protocols: A Quest for A More
  Efficient and Secure Post-Quantum Protocol'
venue:
  name: USENIX Security
  year: 2025
paper:
  url: https://www.usenix.org/system/files/usenixsecurity25-auerbach.pdf
