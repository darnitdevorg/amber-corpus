run:
  command: |
    set -eu
    printf '%s\n' '6f89f2ed465d2041f2998b656dd481dc774805ccab8ab9ec3643bfaa3449b755  ADJKS25_Artifact.zip' | sha256sum --check -
    mkdir amber-messaging
    unzip -q ADJKS25_Artifact.zip -d amber-messaging
    cd amber-messaging/usenix2025_653
    test "$(rustc --version)" = 'rustc 1.93.0 (254b59607 2026-01-19)'
    CARGO_TARGET_DIR=target CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 RUSTFLAGS='-C link-arg=-Wl,--threads=1' \
      cargo build --release --locked --offline -j1 > ../build.log 2>&1
    for protocol in opp-uni-kem uni-kem; do
      target/release/usenix2025sims --fnamebase ../run --numsteps 100000 --balance 0.5 --windowpp 50 --varpp 2 \
        "$protocol" balanced fs-rkem hist small > "../$protocol.log" 2>&1
    done
    python3 -I - <<'PY'
    import csv, json, math
    from pathlib import Path
    values = {}
    for name in ('oppunikem', 'unikem'):
        with open(f'../run_bal_{name}_stats.csv', newline='') as f:
            reader = csv.DictReader(f, skipinitialspace=True, strict=True); rows = list(reader)
        assert reader.fieldnames == 'compromised party,mean,stddev,min,p10,p20,p30,p40,p50,p60,p70,p80,p90,max'.split(',')
        assert len(rows) == 2 and [r['compromised party'] for r in rows] == ['A', 'B']
        for row in rows:
            assert len(row) == 14; numbers = [float(row[k]) for k in reader.fieldnames[1:]]
            assert all(math.isfinite(x) and x >= 0 for x in numbers) and numbers[0] > 0 and numbers[1] > 0
            values[f"{name}_{row['compromised party']}_mean"], values[f"{name}_{row['compromised party']}_variance"] = numbers[0], numbers[1] ** 2
    for metric in ('mean', 'variance'):
        values[f'party_A_{metric}_ratio'] = values[f'oppunikem_A_{metric}'] / values[f'unikem_A_{metric}']
    Path('../metrics.json').write_text(json.dumps(values, indent=2, allow_nan=False) + '\n')
    PY
  outputs:
  - amber-messaging/metrics.json
  - amber-messaging/run_bal_oppunikem_hist.csv
  - amber-messaging/run_bal_oppunikem_stats.csv
  - amber-messaging/run_bal_unikem_hist.csv
  - amber-messaging/run_bal_unikem_stats.csv
  - amber-messaging/opp-uni-kem.log
  - amber-messaging/uni-kem.log
  - amber-messaging/build.log
