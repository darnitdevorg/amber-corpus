resources:
  cpu_only: true
  ram_gb: 3
  disk_gb: 3
  runtime_minutes: 15
  docker: false
  network_required: false
  notes: 'Only the numerical 32-byte primary-primary UniKEM versus Opp-UniKEM subset is tested. Appendix
    A.2.3 lists hardware dependencies as "None"; A.4.2 E1 estimates one compute-minute and 4 MB generated
    data for its full chart workflow, not total setup. https://secartifacts.github.io/usenixsec2025/appendix-files/sec25cycle2ae-final62.pdf.
    The above RAM/disk values are conservative start gates, not quoted author minima: require 3 GiB
    available RAM/free disk, cap each process address space and sampled aggregate worker RSS+swap
    at 1.5 GiB, workspace+cache at 1 GiB, wall/CPU at 900 seconds and each capture at 32 MiB. RSS
    is sampled every 0.1 s and storage every second. Prerequisites: Linux x86-64 /proc, Python 3.12.3
    tested, Rustup with pinned Rust/Cargo 1.93.0 (binary identities checked), GCC 13.3.0, and GNU
    time. Cargo.toml requires Rust >=1.88.0. Before running, use a separate local CARGO_HOME outside
    the fresh extraction and perform a bounded `cargo fetch --locked`; dependencies are identified
    by the original Cargo.lock checksums. Export that CARGO_HOME for the command, which builds offline,
    with one Cargo job/codegen unit and one LLD linker thread. No global toolchain or configuration
    changes. Installed compilers are prerequisites; the workspace cap includes the cache and generated
    files, not system tool installations. Initial setup peaked at 454463488 B aggregate RSS in 129.93
    s; the first four-case CLI/API suite took 3.77 s and 35418112 B aggregate RSS. Artifact archive
    is 342190 B / 703507 B expanded. Source, isolated cache, generated build and captures used about
    367 MB before fresh-command validation. No Gnuplot, chart rendering, other bandwidths, offline-device
    models, real message datasets or full-study reproduction are included. The literal YAML command
    also passed from a fresh archive extraction and a new build target in 128.76 s, with 466673664
    B sampled aggregate worker RSS, zero sampled swap and 364971472 B workspace plus dependency cache.
    All 80 original input files were unchanged; the two original CLI cases, two planned API replays
    and independent message-pattern audit matched the initial metrics. These are actual bounded captures,
    not expected output hashes.'
role: not_comparable
expected_verdict: NOT_COMPARABLE
claims:
- metric: party_A_mean_and_population_variance_ratio_OppUniKEM_over_UniKEM_32B
  threshold: mean ratio < 1 and population variance ratio < 1, using the paper sampling protocol
  unit: dimensionless ratios of exposed-message counts and squared-message counts
  source: Sections 5.1-5.3, printed pp.6729-6731; Section 5.3 opportunistic versus non-opportunistic
    sending; final Figure 7 right. Artifact appendix C4 refers to earlier figure numbering.
  measurement_protocol: The paper specifies T=10^6 timesteps with primary-primary send probabilities
    0.4 per party. Section 5.2 describes recording each party state vulnerability once per timestep
    in which that state changes, then comparing the mean and variance of |VulM| separately for each
    compromised party. Section 5.3 uses party A. Preserve that sampling unit when testing the small-chunk
    directional claim; no numeric tolerance is supplied or invented. The exact artifact command below
    instead uses the published appendix-script parameters T=100000, --balance 0.5 and BasicMessagingBehavior
    probabilities 0.4*0.5=0.2 per party, with message-pattern seed 43. More fundamentally, controlled_messaging_healing_test
    stores a separate compromise snapshot after sending and after a nonempty receive-all event, including
    two snapshots in one timestep. Its resulting event-weighted histogram is a different statistic
    from the paper per-timestep description. Do not classify this command as a paper reproduction
    or paper failure.
  expected_verdict: NOT_COMPARABLE
  notes: All three badges are awarded in the paper row at https://secartifacts.github.io/usenixsec2025/results;
    availability is DOI 10.5281/zenodo.15571277. Both original CLI cases are run unchanged for 32-byte
    chunks using charts/run_tests.sh parameters, with new output paths. Two explicitly planned public-API
    replays expose integer histogram counts using identical CKA types/probabilities/timesteps; they
    must match every CLI probability, CDF bin, mean, standard deviation and decile. Boundary exclusions
    in the original measurement function remain unchanged. An independent seeded message-pattern counter
    establishes at most 36107 party-A state-changing timesteps, yet the original API returns 40123
    Opp-UniKEM and 40043 UniKEM retained snapshots. Thus even after its boundary exclusions the sampled
    events cannot be one-per-changing-timestep. The means 144.9149614934 and 229.0983692531, and population
    variances 1065.3604129456 and 2785.0976581053, satisfy the directional relationship within the
    artifact protocol but do not resolve the method mismatch. Party B is validated as auxiliary evidence,
    not an extra Section 5.3 claim. The paper notes in Section 5.1 footnote 5 that absolute send probabilities
    matter less when their ratio is fixed; this does not repair different sampling weights. No altered
    model, replacement dataset, reduced timestep argument chosen by us, or changed paper threshold
    is used. The inline Rust examples observe public APIs and add no edits to the 80 original artifact
    files. Strict rational comparisons check the internal direction; up to eight ULPs only handle
    independent floating-point arithmetic/serialization checks, not scientific tolerance.
