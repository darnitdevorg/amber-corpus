resources:
  cpu_only: true
  ram_gb: 3
  disk_gb: 3
  runtime_minutes: 15
  docker: false
  network_required: false
  notes: 'Only the numerical 32-byte primary-primary UniKEM/Opp-UniKEM subset is tested. Appendix
    A.2.3 lists hardware dependencies as "None"; A.4.2 E1 estimates one compute-minute and 4 MB generated
    data for its full chart workflow, excluding setup: https://secartifacts.github.io/usenixsec2025/appendix-files/sec25cycle2ae-final62.pdf.
    RAM/disk/runtime fields are conservative local budgets, not author minima. Prerequisites: Linux
    x86-64, Rust/Cargo 1.93.0, GCC 13.3.0 and Python 3.12.3 tested; unzip and sha256sum. Prepare an
    isolated CARGO_HOME outside the fresh working directory with `cargo fetch --locked` using this
    archive''s Cargo.lock, and export CARGO_HOME for the command''s offline build. The archive is
    342190 B / 703507 B expanded; the earlier fresh build plus dependency cache and captures used
    364971472 B and peaked at 466673664 B aggregate worker RSS. One Cargo job/codegen unit and one
    LLD linker thread keep compilation bounded. Amber handles execution limits and input/output digests;
    run.command only verifies the archive, builds, runs the author''s CLI and extracts numeric measurements.
    Charts, other bandwidths, offline-device cases and the full study are outside this entry''s evidence.
    On 2026-10-30 the shortened literal command passed from a fresh archive and new build target in
    147.19 s, with 453890048 B sampled aggregate RSS, no sampled swap or limit events, and 361868304
    B workspace plus isolated cache. Independent checks confirmed all 80 original files unchanged
    and both CLI histogram/statistics CSVs byte-identical to the prior validated run. Baseline digests
    identify this local capture, not scientific acceptance criteria.'
role: not_comparable
expected_verdict: NOT_COMPARABLE
claims:
- metric: party_A_mean_ratio
  threshold: < 1
  unit: ratio
  source: Sections 5.1-5.3, pp.6729-6731; Section 5.3 opportunistic versus non-opportunistic sending,
    Figure 7 right; artifact appendix C4.
  measurement_protocol: The paper's small-chunk comparison uses T=10^6 primary-primary timesteps with
    send probability 0.4 per party. Section 5.2 describes one vulnerability sample per party per timestep
    in which its state changes; Section 5.3 compares party A. The artifact's own charts/run_tests.sh
    instead selects T=100000, --balance 0.5, 32-byte chunks and message-pattern seed 43; src/main.rs
    makes each party's send probability 0.4*0.5=0.2. controlled_messaging_healing_test records separate
    send and nonempty receive-all snapshots, including two within one timestep, and preserves its
    boundary exclusions. This entry runs the two original CLI cases unchanged. The checker reads the
    party-A mean and standard deviation from each *_stats.csv, squares standard deviation for population
    variance, and emits Opp-UniKEM/UniKEM ratios. These event-weighted statistics are not a direct
    test of the paper's timestep-weighted claim.
  expected_verdict: NOT_COMPARABLE
  notes: 'Awarded Available, Functional and Results Reproduced badges: https://secartifacts.github.io/usenixsec2025/results.
    Prior independent public-API captures established 40123 Opp-UniKEM and 40043 UniKEM retained samples
    per party; an independent seed-43 message-pattern counter bounds party A at 36107 state-changing
    timesteps. Thus the sample weighting differs even after boundary exclusions. That audit remains
    local evidence; the short command adds no Rust observers or original-source edits. The paper''s
    Section 5.1 footnote 5 says absolute send probabilities matter less for a fixed ratio, which does
    not resolve the sampling-unit difference. The measured internal directional relationship does
    not establish a paper reproduction or failure. Ratios use the author''s serialized statistics,
    with variance recovered by squaring standard deviation, so last-bit rounding can differ from the
    earlier integer-count calculation.'
  measure:
    file: amber-messaging/metrics.json
    regex: '"party_A_mean_ratio": ([0-9.eE+-]+)'
    comparable: false
    reason: Artifact samples send/receive events separately rather than once per state-changing timestep;
      its horizon and send probability also differ from the paper.
