run:
  command: |
    set -eu
    python3 -I - <<'PYTHON'
    import datetime
    import hashlib
    import json
    import os
    from pathlib import Path
    import platform
    import re
    import resource
    import shutil
    import signal
    import subprocess
    import time

    """Complete, query-aware checker for appendix E1's two five-query analyses."""
    import re

    FORMULAS = [
        'not (event(DeriveKeyA(k)) && event(DeriveKeyB(k)))',
        'not (event(Send(x)) && event(Accept(x)))',
        'event(DeriveKeyA(k_iA))@iA && event(DeriveKeyB(k_iB))@iB ==> k_iA = k_iB || (event(Reveal(k))@j && (j < iA || j < iB))',
        'event(DeriveKeyA(k_sessA))@i && attacker(k_sessA) ==> event(Reveal(k))@j && j < i',
        'event(DeriveKeyB(k_sessB))@i && attacker(k_sessB) ==> event(Reveal(k))@j && j < i',
    ]
    OUTCOMES = {'monolithic': ['false', 'false', 'true', 'true', 'true'],
                'compositional': ['false', 'true', 'true', 'true', 'true']}

    def expression(text):
        # Parse connectives, function applications, event timestamps and comparisons.
        # Only ProVerif's fresh numeric variable suffixes are alpha-normalized.
        text = re.sub(r'\b([A-Za-z][A-Za-z0-9_]*?)_[0-9]+\b', r'\1', text)
        tokens = re.findall(r'==>|&&|\|\||[(),=@<>]|[A-Za-z][A-Za-z0-9_]*', text)
        if ''.join(tokens) != re.sub(r'\s+', '', text):
            raise ValueError('Unexpected formula token')
        index = 0
        precedence = {'==>': 1, '||': 2, '&&': 3, '=': 4, '<': 4, '>': 4, '@': 5}
        def parse(minimum=0):
            nonlocal index
            if index >= len(tokens):
                raise ValueError('Incomplete formula')
            token = tokens[index]; index += 1
            if token == '(':
                left = parse()
                if index >= len(tokens) or tokens[index] != ')':
                    raise ValueError('Unbalanced formula')
                index += 1
            elif token == 'not':
                left = ('not', parse(6))
            elif re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*', token):
                if index < len(tokens) and tokens[index] == '(':
                    index += 1
                    args = [parse()]
                    while index < len(tokens) and tokens[index] == ',':
                        index += 1; args.append(parse())
                    if index >= len(tokens) or tokens[index] != ')':
                        raise ValueError('Malformed application')
                    index += 1
                    left = (token, *args)
                else:
                    left = token
            else:
                raise ValueError('Unexpected atom')
            while index < len(tokens) and precedence.get(tokens[index], -1) >= minimum:
                op = tokens[index]; index += 1
                right = parse(precedence[op]+1)
                left = ('<', right, left) if op == '>' else (op, left, right)
            return left
        result = parse()
        if index != len(tokens):
            raise ValueError('Extra formula tokens')
        return result

    def check_text(text, mode):
        if mode not in OUTCOMES or not text.endswith('\n') or text.count('Verification summary:') != 1:
            raise ValueError('Missing, repeated or truncated summary')
        if re.search(r'(?i)\b(warning|error|cannot be proved|unknown|out of memory)\b', text):
            raise ValueError('Inconclusive analysis or diagnostic')
        before, summary = text.split('Verification summary:')
        if re.fullmatch(r'\s*Query .*?\n-{20,}\s*', summary, re.S) is None:
            raise ValueError('Incomplete summary envelope')
        rows = []
        for line in summary.splitlines():
            if not line.strip() or re.fullmatch('-{20,}', line.strip()):
                continue
            match = re.fullmatch(r'Query (.+) is (true|false)\.', line)
            if not match:
                raise ValueError('Malformed query outcome: '+line)
            rows.append((expression(match[1]), match[2]))
        result_rows = []
        for line in before.splitlines():
            if line.startswith('RESULT'):
                match = re.fullmatch(r'RESULT (.+) is (true|false)\.', line)
                if not match:
                    raise ValueError('Malformed RESULT line')
                result_rows.append((expression(match[1]), match[2]))
        expected = list(zip(map(expression, FORMULAS), OUTCOMES[mode]))
        if rows != expected or result_rows != expected or len(set(repr(x[0]) for x in rows)) != 5:
            raise ValueError('Missing, duplicate, wrong or reordered query coverage')
        if before.count('A trace has been found.') != OUTCOMES[mode].count('false'):
            raise ValueError('Missing or duplicate reachability witness traces')
        return {'query_count': 5, 'outcomes': OUTCOMES[mode],
                'session_key_A_forward_secrecy_verified': 1,
                'session_key_B_forward_secrecy_verified': 1,
                'setup_guarantee_verified': 1}


    def task_bytes(root):
        total = 0
        for folder, _, names in os.walk(root):
            for name in names:
                try:
                    total += (Path(folder) / name).lstat().st_size
                except FileNotFoundError:
                    pass
        return total

    def group_usage(pgid):
        rss = swap = ticks = 0
        for p in Path('/proc').iterdir():
            if not p.name.isdecimal():
                continue
            try:
                stat = (p/'stat').read_text().rsplit(')', 1)[1].split()
                if int(stat[2]) != pgid:
                    continue
                ticks += sum(int(stat[i]) for i in (11, 12, 13, 14))
                for line in (p/'status').read_text().splitlines():
                    if line.startswith('VmRSS:'):
                        rss += int(line.split()[1]) * 1024
                    elif line.startswith('VmSwap:'):
                        swap += int(line.split()[1]) * 1024
            except (FileNotFoundError, ProcessLookupError, PermissionError):
                pass
        return rss, swap, ticks / os.sysconf('SC_CLK_TCK')

    def preflight(root):
        available = next(int(x.split()[1])*1024 for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))
        if available < 4*2**30 or shutil.disk_usage(root).free < 5*2**30:
            raise RuntimeError('Resource preflight failed; no proof launched')

    def capture(command, root, out, budget_root):
        preflight(root)
        def limits():
            resource.setrlimit(resource.RLIMIT_AS, (512*2**20, 512*2**20))
            resource.setrlimit(resource.RLIMIT_CPU, (180, 180))
            resource.setrlimit(resource.RLIMIT_FSIZE, (64*2**20, 64*2**20))
            resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
        start = datetime.datetime.now(datetime.timezone.utc).isoformat()
        then = time.monotonic()
        peak_rss = peak_swap = peak_combined = peak_cpu = 0
        peak_storage = task_bytes(budget_root)
        reason = None
        with (out/'stdout.log').open('xb') as stdout, (out/'stderr.log').open('xb') as stderr:
            p = subprocess.Popen(['/usr/bin/time', '-v', '-o', str(out/'resources.txt'), '--']+command,
                                 cwd=root, stdout=stdout, stderr=stderr,
                                 start_new_session=True, preexec_fn=limits)
            tick = 0
            try:
                while p.poll() is None:
                    rss, swap, cpu = group_usage(p.pid)
                    peak_rss, peak_swap = max(peak_rss, rss), max(peak_swap, swap)
                    peak_combined, peak_cpu = max(peak_combined, rss+swap), max(peak_cpu, cpu)
                    if tick % 10 == 0:
                        peak_storage = max(peak_storage, task_bytes(budget_root))
                    if rss+swap >= 512*2**20:
                        reason = 'aggregate_memory_limit'
                    elif time.monotonic()-then >= 180:
                        reason = 'wall_timeout'
                    elif cpu >= 180:
                        reason = 'group_cpu_limit'
                    elif peak_storage >= 1*2**30:
                        reason = 'workspace_limit'
                    if reason:
                        break
                    tick += 1
                    time.sleep(0.1)
            finally:
                if p.poll() is None:
                    os.killpg(p.pid, signal.SIGTERM)
                    try:
                        p.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        os.killpg(p.pid, signal.SIGKILL)
                code = p.wait()
        result = dict(command=command, cwd=str(root), started_at=start,
                      finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      runtime_seconds=time.monotonic()-then, exit_status=code, limit_reason=reason,
                      sampled_peak_rss_bytes=peak_rss, sampled_peak_swap_bytes=peak_swap,
                      sampled_peak_rss_plus_swap_bytes=peak_combined, sampled_cpu_seconds=peak_cpu,
                      sampled_peak_workspace_bytes=max(peak_storage, task_bytes(budget_root)),
                      memory_sampling_seconds=0.1, storage_sampling_seconds=1,
                      limits={'aggregate_rss_plus_swap_bytes': 512*2**20, 'wall_seconds': 180,
                              'cpu_seconds': 180, 'workspace_bytes': 1*2**30, 'file_bytes': 64*2**20})
        (out/'capture.json').write_text(json.dumps(result, indent=2)+'\n')
        print(json.dumps(result), flush=True)
        if code or reason:
            raise RuntimeError('Proof blocked or failed within frozen limits')
        return result


    MODEL_SHA = '000125fca564ff775454042de5ab008095609ea0c515094f7c47defe1e5f2402'
    SCRIPT_SHA = '3be1e3cc7337744c393d472a1bfa42afb109444c198556e2e9ccb8080032f362'
    COMPOSITION_SHA = '1da62af6e968c6828a3d684c853142ae6280ee9fedc3fdcd3371c300c05da7f6'

    def sha(path):
        return hashlib.sha256(Path(path).read_bytes()).hexdigest()

    def main():
        root = Path.cwd()
        preflight(root)
        for name, digest in [('dh_auth.pv', MODEL_SHA), ('run_bench', SCRIPT_SHA)]:
            if sha(root/'dh'/name) != digest:
                raise ValueError('Wrong artifact input: '+name)
        before = {str(p.relative_to(root)): sha(p) for p in root.rglob('*') if p.is_file()}
        out = root/'amber-composition'
        out.mkdir(exist_ok=False)
        binary = shutil.which('proverif')
        if binary is None:
            raise ValueError('ProVerif 2.05 is required')
        version = subprocess.run([binary, '-help'], text=True, capture_output=True, timeout=15, check=True)
        if not version.stdout.startswith('Proverif 2.05. Cryptographic protocol verifier, by Bruno Blanchet, Vincent Cheval, and Marc Sylvestre\n'):
            raise ValueError('Unexpected ProVerif version')
        (out/'versions.json').write_text(json.dumps(dict(proverif_stdout=version.stdout,
            proverif_stderr=version.stderr, proverif_binary_sha256=sha(binary),
            python=platform.python_version(), platform=platform.platform()), indent=2)+'\n')
        (out/'input-identities.json').write_text(json.dumps(before, indent=2, sort_keys=True)+'\n')
        budget_root = Path(os.environ.get('AMBER_BUDGET_ROOT', root)).resolve()
        if budget_root != root and budget_root not in root.parents:
            raise ValueError('Budget root must contain the artifact')
        results = {}
        for mode in OUTCOMES:
            case = out/mode
            case.mkdir()
            model = (root/'dh/dh_auth.pv').read_text()
            if mode == 'compositional':
                for party in ('A', 'B'):
                    old = '    ; XP_'+party+'(k_sess'+party+')'
                    if model.count(old) != 1:
                        raise ValueError('Unexpected composition boundary')
                    model = model.replace(old, '    (* ; XP_'+party+'(k_sess'+party+') *)')
            (case/'dh_auth.pv').write_text(model)
            expected = MODEL_SHA if mode == 'monolithic' else COMPOSITION_SHA
            if sha(case/'dh_auth.pv') != expected:
                raise ValueError('Wrong derived model identity')
            shutil.copyfile(root/'dh/run_bench', case/'run_bench')
            capture(['bash', 'run_bench'], case, case, budget_root)
            results[mode] = check_text((case/'stdout.log').read_text(), mode)
        after = {str(root/p): sha(root/p) for p in before}
        if any(before[p] != after[str(root/p)] for p in before):
            raise ValueError('Original artifact files changed')
        result = {'session_key_A_forward_secrecy_verified': 1,
                  'session_key_B_forward_secrecy_verified': 1,
                  'total_query_count': 10, 'cases': results}
        (out/'metrics.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
        print(json.dumps(result), flush=True)

    if __name__ == '__main__':
        main()
    PYTHON
  outputs:
  - amber-composition/versions.json
  - amber-composition/input-identities.json
  - amber-composition/metrics.json
  - amber-composition/monolithic/dh_auth.pv
  - amber-composition/monolithic/run_bench
  - amber-composition/monolithic/stdout.log
  - amber-composition/monolithic/stderr.log
  - amber-composition/monolithic/resources.txt
  - amber-composition/monolithic/capture.json
  - amber-composition/compositional/dh_auth.pv
  - amber-composition/compositional/run_bench
  - amber-composition/compositional/stdout.log
  - amber-composition/compositional/stderr.log
  - amber-composition/compositional/resources.txt
  - amber-composition/compositional/capture.json
