resources:
  cpu_only: true
  ram_gb: 0.54
  disk_gb: 1.1
  runtime_minutes: 7
  docker: false
  network_required: true
  notes: |-
    Appendix A.4.2 E1 budgets 100 compute-milliseconds and 10 MB disk for the DH case study;
    this excludes tool provisioning and is not a measured minimum or timing acceptance rule.
    Appendix A.2.3 has no special hardware requirement. Its 70–200 GB RAM recommendation
    and E2's 200 GB disk / hundreds of compute-hours apply to TLS ECH, which is excluded.
    The resource fields here are conservative budgets: 512 MiB address space per process
    and sampled aggregate RSS plus swap per case, 1 GiB total workspace, 180 wall/CPU
    seconds per case, 64 MiB per output file. RAM preflight requires 4 GiB available and
    5 GiB disk free. Each command is sequential and CPU-only. Sample RSS plus swap every
    0.1 s and storage every 1 s; these watchdogs are not cgroup hard limits. RLIMIT_AS,
    RLIMIT_CPU and RLIMIT_FSIZE apply to child processes. A process-group watchdog kills
    remaining work on a limit event.
    Initial capture on 2026-10-28 (Asia/Kolkata), Ubuntu 24.04 / Ryzen 5 6600H / 14.8 GiB RAM:
    monolithic 0.112 s, compositional 0.117 s including the monitor; GNU time reported
    10,284 and 10,212 KiB maximum child RSS. Polling can miss peaks in these short runs;
    GNU time's maximum child RSS is reported separately from sampled aggregate RSS.
    The literal YAML command passed from a second fresh extraction in 0.517 s, with
    25,196 KiB maximum child RSS for the complete outer validation launcher. Both modes
    again produced all ten expected query outcomes and three reachability witnesses;
    all 97 original artifact files remained unchanged. The final checker rejected 70
    incomplete/invalid real-log fixtures. YAML, shell syntax and verdict checks passed.
    No sampled swap or limit event. Tools, downloads (including v2 for comparison), source
    papers, extraction and first captures occupied about 12.8 MB. Only the existing native
    ProVerif executable was copied into isolated setup; no compiler/container/install needed.
    The pinned v6 archive is 1,120,238 bytes and 1,532,652 bytes unpacked. Both selected DH
    files are byte-identical in v2 and v6. The artifact's README describes only the
    monolithic invocation; appendix E1 additionally requires the compositional invocation
    and correctly specifies its changed second sanity outcome.
    Prerequisites: Linux x86_64 with /proc, Python 3.9+, bash, GNU /usr/bin/time, and an
    already installed native ProVerif 2.05 on PATH. Tool provisioning is a prerequisite;
    these measured setup figures describe copying an existing native installation. Obtain
    the official ProVerif 2.05 source from
    https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
    (SHA-256 4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4),
    also bundled in the artifact. With an isolated OCaml toolchain, extract it and run
    ./build following its README; alternatively use a pre-existing 2.05 installation.
    The command below verifies the version and records the actual native binary digest;
    it does not assume that independently compiled binaries have identical hashes.
    Download the versioned archive using artifact.clone, extract into a new directory,
    export PATH to the isolated ProVerif installation, and run from that extraction root.
    A new amber-composition directory is required. The command itself is offline;
    network_required covers public artifact/tool retrieval. AMBER_BUDGET_ROOT may point
    to an enclosing task directory to include setup/downloads in storage monitoring;
    otherwise the extraction root is monitored. Account for prerequisite storage separately.
    Only appendix E1's single-session symbolic DH/data-exchange model is tested. No TLS,
    speedup, computational-security, deployed-protocol, unbounded-session or full-study
    reproduction claim is made.
role: positive
