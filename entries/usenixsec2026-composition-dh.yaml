    This entry verifies the case study's mechanized claims, not the general composition
    theorem or the TLS benchmark. Expected false sanity outcomes indicate reachability,
    not a failed forward-secrecy claim.
  measure:
    file: amber-composition/metrics.json
    regex: '"session_key_B_forward_secrecy_verified": ([0-9]+)'
run:
  command: |
    set -eu
    printf '%s\n' 'd06bc529054fc83c0a2520e9d2cc486e1a6e96a2109847a3a3e248053062efdd  composition-v6.zip' | sha256sum -c -
    mkdir amber-composition
    unzip -q composition-v6.zip -d amber-composition/artifact
    proverif -help > amber-composition/version.txt
    grep -Fx 'Proverif 2.05. Cryptographic protocol verifier, by Bruno Blanchet, Vincent Cheval, and Marc Sylvestre' amber-composition/version.txt
    for mode in monolithic compositional; do
      mkdir "amber-composition/$mode"
      cp amber-composition/artifact/dh/* "amber-composition/$mode/"
    done
    sed 's/; XP_A(k_sessA)/(* & *)/;s/; XP_B(k_sessB)/(* & *)/' amber-composition/artifact/dh/dh_auth.pv > amber-composition/compositional/dh_auth.pv
    for mode in monolithic compositional; do
      (cd "amber-composition/$mode"; bash run_bench > stdout.log 2> stderr.log)
    done
    python3 -I - <<'PY'
    import json, re
    from pathlib import Path
    expected = [
     'not (event(DeriveKeyA(k)) && event(DeriveKeyB(k)))',
     'not (event(Send(x)) && event(Accept(x)))',
     'event(DeriveKeyA(k_iA))@iA && event(DeriveKeyB(k_iB))@iB ==> k_iA = k_iB || (event(Reveal(k))@j && (iA > j || iB > j))',
     'event(DeriveKeyA(k_sessA))@i && attacker(k_sessA) ==> event(Reveal(k))@j && i > j',
     'event(DeriveKeyB(k_sessB))@i && attacker(k_sessB) ==> event(Reveal(k))@j && i > j']
    def normalize(s): return re.sub(r'\s+|_\d+\b', '', s)
    def check(folder, statuses):
        text = (folder/'stdout.log').read_text()
        assert not (folder/'stderr.log').read_bytes() and text.endswith('\n')
        assert text.count('Verification summary:') == 1 and not re.search(r'(?i)warning|error|cannot be proved|unknown', text)
        before, summary = text.split('Verification summary:')
        assert re.fullmatch(r'\s*(?:Query [^\n]+\n\s*){5}-{20,}\s*', summary)
        rows = re.findall(r'^Query (.+) is (true|false)\.$', summary, re.M)
        assert [normalize(q) for q, _ in rows] == list(map(normalize, expected))
        assert [value for _, value in rows] == statuses
        assert re.findall(r'^RESULT (.+) is (true|false)\.$', before, re.M) == rows
        assert before.count('A trace has been found.') == statuses.count('false')
        return [int(rows[i][1] == 'true') for i in (3, 4)]
    root = Path('amber-composition')
    mono = check(root/'monolithic', ['false', 'false', 'true', 'true', 'true'])
    comp = check(root/'compositional', ['false', 'true', 'true', 'true', 'true'])
    metrics = {f'session_key_{party}_forward_secrecy_verified': min(mono[i], comp[i]) for i, party in enumerate(('A', 'B'))}
    (root/'metrics.json').write_text(json.dumps(metrics, sort_keys=True)+'\n')
    PY
  outputs:
  - amber-composition/version.txt
  - amber-composition/metrics.json
  - amber-composition/monolithic/dh_auth.pv
  - amber-composition/monolithic/run_bench
  - amber-composition/monolithic/stdout.log
  - amber-composition/monolithic/stderr.log
  - amber-composition/compositional/dh_auth.pv
  - amber-composition/compositional/run_bench
  - amber-composition/compositional/stdout.log
  - amber-composition/compositional/stderr.log
