resources:
  cpu_only: true
  ram_gb: 0.54
  disk_gb: 1.1
  runtime_minutes: 7
  docker: false
  network_required: true
  notes: |
    Appendix A.4.2 E1 estimates 100 compute-milliseconds and 10 MB disk for the selected DH case
    study, excluding tool provisioning; these are not timing acceptance thresholds. The 70–200 GB RAM
    recommendation and E2's 200 GB disk / hundreds of compute-hours apply to TLS ECH, which is excluded.
    https://secartifacts.github.io/usenixsec2026/appendix-files/sec26cycle1ae-final98.pdf
    The numeric resource fields are conservative execution budgets. Amber enforces limits and records
    input/output digests. Resource samplers, watchdogs and artifact manifests remain only in ignored
    local verification, outside run.command. Prerequisites: Linux x86_64, Python 3.9+, unzip, sha256sum
    and native ProVerif 2.05 on PATH. The pinned archive bundles the official ProVerif 2.05 source
    (SHA-256 4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4); build it with an
    isolated OCaml toolchain following its README, or use an existing 2.05 installation. The command
    checks the version. Download composition-v6.zip via artifact.clone before running; the command
    itself is offline. Require a new amber-composition directory. The archive is 1120238 B and
    1532652 B expanded; both DH files are byte-identical between versions 2 and 6. Initial setup,
    downloads, source and captures used about 12.8 MB, reusing an existing native verifier. Initial
    captures on 2026-10-28: monolithic 0.112 s / 10284 KiB maximum child RSS, compositional 0.117 s /
    10212 KiB. The earlier literal command passed a fresh extraction in 0.517 s, with 25196 KiB peak
    child RSS for the outer validation launcher. Independent checks confirmed all ten outcomes,
    three reachability witnesses and all 97 original files unchanged. Baseline hashes identify a local
    capture, not scientific acceptance thresholds. Only appendix E1's single-session symbolic model is
    tested; no TLS, speedup, general-theorem, computational-security or full-study claim is made.
    On 2026-10-30 the revised literal command passed fresh inputs in 0.316 s; sampled aggregate RSS plus swap peaked at 5197824 B, with no sampled swap or limit event. Independent validation passed. The short checker rejected 66 malformed/incomplete fixtures. Baseline records this actual capture.
role: positive
expected_verdict: REPRODUCED
claims:
- metric: session_key_A_forward_secrecy_verified
  threshold: == 1
  unit: boolean
  source: Section 6.2, pp.447–448, forward-secrecy definition for A and analogous B property; appendix A.4.1
    C1 / A.4.2 E1 query 4. https://www.usenix.org/system/files/usenixsecurity26-cremers.pdf ; https://secartifacts.github.io/usenixsec2026/appendix-files/sec26cycle1ae-final98.pdf
  measurement_protocol: |-
    Use ProVerif 2.05 and the artifact's bash run_bench on two fresh copies of dh/dh_auth.pv.
    The monolithic copy is unmodified. In the compositional copy, comment out only the
    calls ; XP_A(k_sessA) and ; XP_B(k_sessB), as appendix E1 directs (lines 121 and 133).
    Preserve all five queries and all protocol/cryptographic assumptions. Require the
    five complete source-ordered outcomes [false,false,true,true,true] for monolithic
    and [false,true,true,true,true] for compositional; match every query formula and
    its RESULT line to the final Verification summary. The false negated reachability
    queries must have witness traces (two monolithic, one compositional). Query 3 must
    prove the set-up guarantee in both modes, and queries 4/5 must prove forward secrecy
    of A/B's session key in both modes. Compare the complete query text after normalizing whitespace and fresh numeric variable
    suffixes, retaining all connectives, grouping and explicit time-order comparisons. No repetitions, averaging or runtime tolerance apply. Reject incomplete,
    duplicate, malformed, inconclusive or unexpected outcomes and any limit/setup failure.
    Assign 1 to this metric only when query 4 for party A is explicitly true in both modes and the complete ten-query gate passes.
  expected_verdict: REPRODUCED
  notes: |-
    One modeled DH session per role; ideal symmetric encryption, signatures, and the
    specified DH equation; freshly generated honest signing keys; attacker-controlled
    public channels c and xc; either long-term signing key can be dynamically revealed.
    Forward secrecy means a derived session key can be known by the attacker only if
    some long-term key was revealed before its derivation event. The set-up guarantee
    allows unequal DH keys only following a prior reveal. No extra axioms, restrictions,
    helper lemmas, changed prover settings, or universal-session claims are introduced.
    This entry verifies the case study's mechanized claims, not the general composition
    theorem or the TLS benchmark. Expected false sanity outcomes indicate reachability,
    not a failed forward-secrecy claim.
  measure:
    file: amber-composition/metrics.json
    regex: '"session_key_A_forward_secrecy_verified": ([0-9]+)'
