claims:
- metric: session_key_A_forward_secrecy_verified
  threshold: == 1
  unit: boolean
  source: Section 6.2, pp.447–448, forward-secrecy definition for A and analogous B property; appendix A.4.1
    C1 / A.4.2 E1 query 4. https://www.usenix.org/system/files/usenixsecurity26-cremers.pdf ; https://secartifacts.github.io/usenixsec2026/appendix-files/sec26cycle1ae-final98.pdf
  measurement_protocol: |-
    Use ProVerif 2.05 and the artifact's bash run_bench on two fresh copies of dh/dh_auth.pv.
    The monolithic copy is unmodified. In the compositional copy, comment out only the
    calls ; XP_A(k_sessA) and ; XP_B(k_sessB), as appendix E1 directs (lines 121 and 133).
    Preserve all five queries and all protocol/cryptographic assumptions. Require the
    five complete source-ordered outcomes [false,false,true,true,true] for monolithic
    and [false,true,true,true,true] for compositional; match every query formula and
    its RESULT line to the final Verification summary. The false negated reachability
    queries must have witness traces (two monolithic, one compositional). Query 3 must
    prove the set-up guarantee in both modes, and queries 4/5 must prove forward secrecy
    of A/B's session key in both modes. Normalize only fresh numeric variable suffixes,
    redundant parentheses, and equivalent reversed time comparisons through a formula
    parser. No repetitions, averaging or runtime tolerance apply. Reject incomplete,
    duplicate, malformed, inconclusive or unexpected outcomes and any limit/setup failure.
    Assign 1 to this metric only when query 4 for party A is explicitly true in both modes and the complete ten-query gate passes.
  expected_verdict: REPRODUCED
  notes: |-
    One modeled DH session per role; ideal symmetric encryption, signatures, and the
    specified DH equation; freshly generated honest signing keys; attacker-controlled
    public channels c and xc; either long-term signing key can be dynamically revealed.
    Forward secrecy means a derived session key can be known by the attacker only if
    some long-term key was revealed before its derivation event. The set-up guarantee
    allows unequal DH keys only following a prior reveal. No extra axioms, restrictions,
    helper lemmas, changed prover settings, or universal-session claims are introduced.
    This entry verifies the case study's mechanized claims, not the general composition
    theorem or the TLS benchmark. Expected false sanity outcomes indicate reachability,
    not a failed forward-secrecy claim.
