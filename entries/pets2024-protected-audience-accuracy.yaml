# Verified subset: artifact appendix Main Result 1 / Experiment 1 only, the deterministic Figure 2 accuracy
# evaluation (scenario_2_accuracy.py, eps = 1). Figure 3, Table 1 and every eps = 10 statement are excluded; see
# resources.notes.
id: pets2024-protected-audience-accuracy
title: Evaluating Google's Protected Audience Protocol
venue:
  name: PETS
  year: 2024
paper:
  url: https://petsymposium.org/popets/2024/popets-2024-0147.pdf
  doi: 10.56553/popets-2024-0147
artifact:
  url: https://github.com/Elena6918/PrAu-Simulation/tree/2cfd2bd03101967aa681f218efdce6cf5696dad6
  clone: git clone https://github.com/Elena6918/PrAu-Simulation.git && cd PrAu-Simulation && git checkout
    2cfd2bd03101967aa681f218efdce6cf5696dad6, then run run.command in the checkout root.
  ref_type: commit
  ref: 2cfd2bd03101967aa681f218efdce6cf5696dad6
  license: MIT
badges:
- reproduced
resources:
  cpu_only: true
  ram_gb: 1
  disk_gb: 1
  runtime_minutes: 5
  docker: false
  network_required: true
  notes: |
    The artifact appendix is "Artifact Appendix.md" in the repository. Experiment 1 (Figure 2):
    "python scenario_2_accuracy.py ... Should take less than a minute to run." Main Result 1: "A figure
    that shows the relationship between the number of colluding buyers and the expected accuracy of the
    adversary's prediction algorithm in scenario2. An integral evaluation by computation software." No
    hardware or memory requirement is stated. The PoPETs 2024 results page lists this commit with the
    badge "artifact-reproduced": https://secartifacts.github.io/pets2024/results.

    Tested: Experiment 1 only. scenario_2_accuracy.py evaluates the paper's accuracy integral (Section 4.2,
    proof in the appendix) with a midpoint rule for eps = 1, n = 1..20 and six candidate pool sizes k,
    then saves Accuracy.pdf. It prints nothing, so run.command runs it unmodified through runpy with
    pyplot.plot wrapped to record the plotted values into amber-prau/curves.json. The computation has no
    randomness, so the values are exact run to run.

    Excluded: Figure 3 and Table 1. The appendix's plot_fpr.py and simulate_colluder_num.py only replay
    the shipped simulation outputs (metrics_e1/, metrics_e10/, num_colluders/); regenerating them is
    stochastic and takes "around 6 hours" per Figure 3 file and "roughly two weeks" for all of them.
    Also excluded: every eps = 10 statement, including "the expected accuracy exceeds 99% with only two
    colluding buyers with 1 million targeted users", because the script fixes eps = 1. The sentence
    "Even when there are one million target users, an adversary with at least 15 colluding buyer sites
    can identify a user ... with high confidence" gives no number, so it is not a claim; the computed
    accuracy there is 0.781653 (acc_n15_k1m) and 0.99 is first exceeded at n = 19 for k = 1M.

    Native, no Docker: a Python 3 venv with hash-pinned cp312 manylinux wheels for the four packages the
    script imports (numpy 1.26.4, scipy 1.14.1, matplotlib 3.10.1, mpmath 1.3.0) and their dependencies.
    The artifact's requirements.txt is unpinned and also lists mmh3 and bitarray, which only the
    simulation scripts import. Python 3.12.3 on Linux x86_64 was tested. The command refuses a
    different commit or any edit to tracked files (git diff --quiet). network_required covers git and
    PyPI; the computation is offline.

    The claims and thresholds were frozen before the first run. First run on 2026-11-20 in a fresh clone:
    18.5 s wall including venv setup, 132340 KiB peak RSS (GNU time), under a 2 GiB memory cap with swap
    disabled, empty stderr. Accuracy(13, 1K) = 0.995231; all six curves are non-decreasing in n; the k
    ordering holds at all 20 n. The smallest n above 0.99 is 13 for k = 1K, the number the paper gives.

    An independent validator evaluated the same integral another way: mpmath adaptive quadrature at 50
    digits over the exact Laplace pdf and cdf, split at -n and 0, instead of the script's midpoint rule.
    It gave Accuracy(13, 1K) = 0.995648, agreed with the artifact's 120 values to within 4.2e-4, and
    re-derived the same three claim values and the same smallest-n-above-0.99 for every k.

    The literal run.command then passed from a second fresh clone on 2026-11-20: 17.4 s wall, 132960 KiB
    peak RSS, empty stderr, the same metrics, and the validator agreed again. All five outputs, including
    Accuracy.pdf (SOURCE_DATE_EPOCH=0), were byte-identical to the first run. The checker rejected 9
    broken-output fixtures (missing curves.json or Accuracy.pdf, Traceback on stderr, five curves,
    reordered labels, 19 points, NaN, a value above 1, truncated JSON) and, for 3 claim-tampering
    fixtures (Accuracy(13, 1K) = 0.985, a non-monotone curve, a broken k ordering), reported the changed
    values so the thresholds fail; only the genuine output satisfies all three claims.
role: positive
expected_verdict: REPRODUCED
claims:
- metric: acc_n13_k1k_above_099
  threshold: == 1
  unit: boolean (Accuracy(13, 1K) > 0.99)
  source: "Paper Section 4.2 \"Scenario 2\" and Figure 2 (eps = 1), p. 899, https://petsymposium.org/popets/2024/popets-2024-0147.pdf; artifact appendix Main Result 1 / Experiment 1 (Artifact Appendix.md at ref 2cfd2bd03101967aa681f218efdce6cf5696dad6)"
  measurement_protocol: "Run the artifact's scenario_2_accuracy.py unmodified (runpy, MPLBACKEND=Agg) with matplotlib.pyplot.plot wrapped to record each curve's label, x and y; the y values are the script's own midpoint-rule evaluation of the paper's accuracy integral Accuracy(n, k) = int f_Lap(Y) F_Lap(n + Y)^(k-1) dY for eps = 1, n = 1..20 colluding buyers and k in {2, 100, 1K, 10K, 100K, 1M} candidate users. All six curves, all 20 points each and finite values in [0, 1] are required. The script has no randomness. Setup failures and timeouts are blockers, never scientific failures. The value is 1 when the k=1K curve at n = 13 is strictly greater than 0.99."
  expected_verdict: REPRODUCED
  notes: "Paper: \"With 13 colluders (the primary site and 12 additional buyers), the expected accuracy in prediction of this simple attack exceeds 99 percent when the target user list has 1,000 users.\""
  measure:
    file: amber-prau/metrics.json
    regex: '"acc_n13_k1k_above_099": ([0-9]+)'
- metric: curves_nondecreasing_in_n
  threshold: == 6
  unit: curves (of 6)
  source: "Paper Section 4.2 \"Scenario 2\" and Figure 2 (eps = 1), p. 899, https://petsymposium.org/popets/2024/popets-2024-0147.pdf; artifact appendix Main Result 1 / Experiment 1 (Artifact Appendix.md at ref 2cfd2bd03101967aa681f218efdce6cf5696dad6)"
  measurement_protocol: "Run the artifact's scenario_2_accuracy.py unmodified (runpy, MPLBACKEND=Agg) with matplotlib.pyplot.plot wrapped to record each curve's label, x and y; the y values are the script's own midpoint-rule evaluation of the paper's accuracy integral Accuracy(n, k) = int f_Lap(Y) F_Lap(n + Y)^(k-1) dY for eps = 1, n = 1..20 colluding buyers and k in {2, 100, 1K, 10K, 100K, 1M} candidate users. All six curves, all 20 points each and finite values in [0, 1] are required. The script has no randomness. Setup failures and timeouts are blockers, never scientific failures. Count the k curves for which Accuracy(n + 1, k) >= Accuracy(n, k) for every n = 1..19."
  expected_verdict: REPRODUCED
  notes: "Paper: \"As the number of reports (which is the number of colluding buyer sites controlled by the adversary) aggregated increases, the adversary quickly reaches a high expected accuracy\"."
  measure:
    file: amber-prau/metrics.json
    regex: '"curves_nondecreasing_in_n": ([0-9]+)'
- metric: k_ordered_points
  threshold: == 20
  unit: n values (of 20)
  source: "Paper Section 4.2 \"Scenario 2\" and Figure 2 (eps = 1), p. 899, https://petsymposium.org/popets/2024/popets-2024-0147.pdf; artifact appendix Main Result 1 / Experiment 1 (Artifact Appendix.md at ref 2cfd2bd03101967aa681f218efdce6cf5696dad6)"
  measurement_protocol: "Run the artifact's scenario_2_accuracy.py unmodified (runpy, MPLBACKEND=Agg) with matplotlib.pyplot.plot wrapped to record each curve's label, x and y; the y values are the script's own midpoint-rule evaluation of the paper's accuracy integral Accuracy(n, k) = int f_Lap(Y) F_Lap(n + Y)^(k-1) dY for eps = 1, n = 1..20 colluding buyers and k in {2, 100, 1K, 10K, 100K, 1M} candidate users. All six curves, all 20 points each and finite values in [0, 1] are required. The script has no randomness. Setup failures and timeouts are blockers, never scientific failures. Count the n in 1..20 at which accuracy strictly decreases along k = 2, 100, 1K, 10K, 100K, 1M."
  expected_verdict: REPRODUCED
  notes: "Figure 2 draws the six curves in this order at every n: a larger candidate pool always lowers the accuracy."
  measure:
    file: amber-prau/metrics.json
    regex: '"k_ordered_points": ([0-9]+)'
run:
  command: |
    set -eu
    test "$(git rev-parse HEAD)" = 2cfd2bd03101967aa681f218efdce6cf5696dad6
    git diff --quiet
    mkdir amber-prau
    python3 -m venv amber-prau/venv
    cat > amber-prau/requirements.txt <<'REQ'
    contourpy==1.3.3 --hash=sha256:4d00e655fcef08aba35ec9610536bfe90267d7ab5ba944f7032549c55a146da1
    cycler==0.12.1 --hash=sha256:85cef7cff222d8644161529808465972e51340599459b8ac3ccbac5a854e0d30
    fonttools==4.68.0 --hash=sha256:3edce69ecdefa73ab1041901ca22eefed6ebb93a77bc77e889d940479f25bf7d
    kiwisolver==1.5.1 --hash=sha256:34633ecf50d16187ab8e5528b7a2530f2feb4e23f300db4672538b51cfc5cd38
    matplotlib==3.10.1 --hash=sha256:c96f2c2f825d1257e437a1482c5a2cf4fee15db4261bd6fc0750f81ba2b4ba3d
    mpmath==1.3.0 --hash=sha256:a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
    numpy==1.26.4 --hash=sha256:675d61ffbfa78604709862923189bad94014bef562cc35cf61d3a07bba02a7ed
    packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
    pillow==13.0.0 --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca
    pyparsing==3.3.3 --hash=sha256:ece8c00a69cf01b45d0b1dedabb469c90d8caf996d4fda40f147627a122849a4
    python-dateutil==4.0.0 --hash=sha256:a5e246f79eb80475e691bf93862cead98decd8a498cf53ba0516fcdc0f50dc1c
    scipy==1.14.1 --hash=sha256:8f9ea80f2e65bdaa0b7627fb00cbeb2daf163caa015e59b7516395fe3bd1e066
    tzdata==2026.6 --hash=sha256:0a10eec6e13ef16b627fabed9a5f2ba61a62b1c67f327305f4e7e412a70b4aec
    REQ
    amber-prau/venv/bin/pip install --quiet --no-input --require-hashes -r amber-prau/requirements.txt
    amber-prau/venv/bin/python -c "import sys, numpy, scipy, matplotlib, mpmath; print(sys.version.split()[0], numpy.__version__, scipy.__version__, matplotlib.__version__, mpmath.__version__)" > amber-prau/versions.log
    export MPLBACKEND=Agg MPLCONFIGDIR="$PWD/amber-prau/mpl" PYTHONDONTWRITEBYTECODE=1 SOURCE_DATE_EPOCH=0
    amber-prau/venv/bin/python - <<'RUN' > amber-prau/curves.json 2> amber-prau/run.err
    import json, runpy, matplotlib.pyplot as plt
    curves, plot = [], plt.plot
    def record(x, y, *a, **kw):
        curves.append({'label': kw['label'], 'x': [int(v) for v in x], 'y': [float(v) for v in y]}); return plot(x, y, *a, **kw)
    plt.plot = record
    runpy.run_path('scenario_2_accuracy.py', run_name='__main__')
    print(json.dumps(curves))
    RUN
    python3 -I - <<'CHECK' > amber-prau/metrics.json
    import json, math, pathlib
    assert pathlib.Path('Accuracy.pdf').stat().st_size > 0 and 'Traceback' not in open('amber-prau/run.err').read(), 'script failed'
    C = json.load(open('amber-prau/curves.json')); L = ['k=2', 'k=100', 'k=1K', 'k=10K', 'k=100K', 'k=1M']
    assert [c['label'] for c in C] == L, 'six Figure 2 curves'
    assert all(c['x'] == list(range(1, 21)) and len(c['y']) == 20 and all(math.isfinite(v) and 0 <= v <= 1 for v in c['y']) for c in C), 'n = 1..20, accuracies in [0, 1]'
    A = {c['label']: c['y'] for c in C}
    first = {k: next((n for n, v in enumerate(A[k], 1) if v > 0.99), None) for k in L}
    print(json.dumps({'acc_n13_k1k_above_099': int(A['k=1K'][12] > 0.99),
        'curves_nondecreasing_in_n': sum(all(b >= a for a, b in zip(y, y[1:])) for y in A.values()),
        'k_ordered_points': sum(all(A[L[i]][n] > A[L[i + 1]][n] for i in range(5)) for n in range(20)),
        'acc_n13_k1k': round(A['k=1K'][12], 6), 'acc_n15_k1m': round(A['k=1M'][14], 6),
        'smallest_n_above_099': first}, sort_keys=True))
    CHECK
  outputs:
  - amber-prau/versions.log
  - amber-prau/curves.json
  - amber-prau/run.err
  - amber-prau/metrics.json
  - Accuracy.pdf
