badges: [available, functional, reproduced]

# Research requirements, not the source audit's requirements.
# https://secartifacts.github.io/usenixsec2024/appendix-files/sec24fallae-final33.pdf
resources:
  cpu_only: true
  ram_gb: 10               # appendix A.4.2 experiment budget; not a guaranteed upper bound
  disk_gb: 500             # appendix A.2.3 minimum for all experiments, not just E2 below
  runtime_minutes: null    # compute-hour budgets do not establish wall-clock runtime
  docker: true             # local experiments; Kubernetes is an alternative
  network_required: true   # source/dependency/image and firmware-dataset retrieval
  notes: >
    Appendix A.2.3 requires at least 500 GB for all experiments; A.4.2 E2
    budgets eight compute-hours, 5 GB disk and 10 GB RAM for seven firmware
    images. A.2.4 describes Ubuntu 22.04 x64, Python 3.11 and pip 24 or later.
    ExperimentReplication.md:14-17 describes single-core containers with at
    least 5 GB RAM, parallelized across 4000 cores, and warns that some binaries
    exceed 20 GB RAM. These are not bounded small-laptop full experiments.
    No firmware datasets, containers or research dependencies were installed
    or executed; only the pinned source checkout was audited.

role: positive             # conference reproduction badge, not endorsement of every hygiene result
