# Verified subset: artifact appendix Experiments 1-3, the six minimal reproducible examples (MREs) that replicate
# the bug classes found in Opacus, Diffprivlib, dpmm, SmartNoise, Synthcity and MOSTLY AI, plus the suite's
# correct-mechanism control. Experiment 4 (Docker harness on dpmm/mbi/synthcity) and the paper's audit of 12
# libraries are excluded; see resources.notes.
id: pets2026-dp-recorder
title: 'Privacy in Theory, Bugs in Practice: Grey-Box Auditing of Differential Privacy Libraries'
venue:
  name: PETS
  year: 2026
paper:
  url: https://petsymposium.org/popets/2026/popets-2026-0091.pdf
  doi: 10.56553/popets-2026-0091
artifact:
  url: https://github.com/ObliviousAI/dp-recorder/tree/85d189ebd7ff81a52984708322ee2c2d8c479db4
  clone: git clone https://github.com/ObliviousAI/dp-recorder.git && cd dp-recorder && git checkout
    85d189ebd7ff81a52984708322ee2c2d8c479db4, then run run.command in the checkout root.
  ref_type: commit
  ref: 85d189ebd7ff81a52984708322ee2c2d8c479db4
  license: Apache-2.0
badges:
- available
- functional
- reproduced
resources:
  cpu_only: true
  ram_gb: 1
  disk_gb: 1
  runtime_minutes: 5
  docker: false
  network_required: true
  notes: |
    The artifact appendix is ARTIFACT_APPENDIX.md in the repository. "Can run on a laptop (No special
    hardware requirements)"; "Each deterministic experiment takes < 1 compute-minute. The statistical audit
    experiment takes less than 10 compute-minutes"; "Storage: < 100 MB of disk space for the repository,
    excluding Docker layers." The AEC row (issue 2026.3) awards available, functional and reproduced and
    pins this commit: https://secartifacts.github.io/pets2026/results.

    Tested: the appendix's own pytest commands for Experiment 1 (test_buggy_private_mean,
    test_domain_inference), Experiment 2 (test_sensitivity_miscalibration, test_noise_miscalibration,
    test_nan_injection) and Experiment 3 (test_double_spending), then the whole suite from "Testing the
    Environment", which adds the correct-mechanism control (test_correct_mechanism). Each MRE runs the
    record/replay auditor on a dataset D and a neighbour D' and expects the auditor to raise; the test
    catches that AssertionError and prints it, so a PASSED test means the bug was caught. -s is added to
    every command so those printed messages land in the logs (the appendix already uses -s for
    Experiment 3). The checker reads each message, not just the pass/fail status.

    Excluded: Experiment 4, the Docker harness that audits instrumented dpmm, mbi and synthcity. It needs
    Docker, and the appendix says its failure count "may vary slightly between distinct runs". The paper's
    headline audit (12 libraries, 13 violations, Table 1) is not packaged in the artifact (appendix
    "Limitations"); the MREs are the authors' reduced analogues of those bugs. This entry makes no claim
    about Experiment 4 or about any real library.

    Randomness: the deterministic checks (Experiments 1, 2 and the control) compare inputs that the test
    fixes, so their messages are identical on every run. Experiment 3 estimates epsilon from 10,000 samples
    with numpy's unseeded global RNG, so its value moves: 1.55 to 1.80 over the twelve executions here
    (both runs, both suites, eight repeats), and the appendix's example is 1.98. Only the bound "> 1.0" is judged; the value is kept for
    drift tracking.

    Native, no Poetry or Docker: a Python 3.11 venv with hash-pinned wheels. The 34 versions and sha256
    are taken from the artifact's poetry.lock (its Python 3.11 resolution, cp311 manylinux x86_64 or
    pure wheels; Windows-only, Python 3.10-only and coverage packages left out). pyproject.toml requires
    Python >=3.10,<3.12 and the authors' Dockerfile uses 3.11. PYTHONPATH=src replaces `poetry install`,
    which only installs the same src/ package. The command refuses a different commit or any edit to
    tracked files (git diff --quiet).

    First capture on 2026-11-17 in a fresh clone: every pytest run exit 0, 51 s wall including venv setup,
    264836 KiB peak RSS (GNU time), under a 3 GiB memory cap with swap disabled; 7/7 suite tests passed.
    Metrics 2 / 3 / 0 / 1 and epsilon 1.75. One fix after this run: the checker cut the last test's log block
    at the "=====" summary, but pytest prints the "generated xml file" line between PASSED and that summary, so
    the checker failed on its own parsing. The block now ends at that line; it was re-run on the same
    outputs. No claim, threshold or protocol changed. The claims were frozen before the run.

    An independent validator re-derived everything another way, without pytest or the checker's parsing.
    It imported the artifact's buggy functions and Auditor directly and drove record/replay itself; it
    recomputed each expected distance from the test inputs in plain Python (|2 - 99| = 97, |2 - 1| = 1,
    NaN -> inf) and each Record/Replay pair (3 vs 2); it ran the correct mechanism without an exception; it
    re-ran the double-spending audit with a fixed seed (epsilon 1.7517) and computed the analytic
    composition of two Laplace(1) mechanisms with dp_accounting (2.0000, single 1.0000), matching Section
    4.3.6's "2ε". All 13 checks passed and its five values equal the checker's. The checker rejected or failed
    27 incomplete or invalid fixtures (missing or empty logs, XML and status file, a missing run or pytest
    usage error, FAILED tests, removed, renamed or duplicated tests, a removed, relabelled or wrong-valued
    equality message, Dist <= Sens, a wrong distance, a removed or duplicated violation line, a removed
    budget message, epsilon 0.98 / NaN / missing, an injected traceback, a failing or missing control, a
    junit collection error or duplicate testcase) and accepted only the genuine output. A wrong commit, an
    edited src/dp_recorder/auditing/audit_primitives.py and an edited tests/test_double_spending.py each
    stopped the command before amber-dprecorder/ was created.

    The literal run.command, parsed from this file, passed in a second fresh clone on 2026-11-17: exit 0,
    38 s wall, 269168 KiB peak RSS, 524 MB workspace (checkout, venv, captures), the same 2 / 3 / 0 / 1 and
    epsilon 1.80. Validator 13/13, all 27 fixtures and a replay of every measure block re-confirmed.
    Baseline hashes below are from this fresh run. versions.log and status.txt were byte-identical to the
    first capture; the logs differ only in the run directory, timings and the epsilon lines, and the junit
    XML carries timestamps and the host name.

    Prerequisites: Linux x86_64, POSIX shell, git, Python 3.11 with venv on PATH as python3.11 (tested
    3.11.15, e.g. `uv python install 3.11.15`), and network access to GitHub and PyPI. The experiment itself
    is offline.
role: positive
expected_verdict: REPRODUCED
claims:
- metric: invariance_violations_flagged
  threshold: == 2
  unit: caught invariance violations
  source: 'Paper Section 3.2 (p.471): ensure_equality "asserts that the input q matches the recorded input from
    the D trace. If they differ, it flags a violation."; Section 4.3.7 Opacus and 4.3.4 Diffprivlib / 4.3.8 dpmm
    (pp.475-476); artifact appendix Experiment 1.'
  measurement_protocol: 'Run `pytest tests/test_buggy_private_mean.py tests/test_domain_inference.py -v -s`.
    The first MRE leaks the dataset size into a public scaling factor (Opacus, len(dataset)); the second infers
    the class domain from private data with np.unique (Diffprivlib, dpmm). A test counts only if junit and the
    log both say PASSED and its log block holds exactly one caught "Equality Failure @ ''n''" (first test) or
    "''num_classes''" (second test) with Record (D) 3 and Replay (D'') 2, the values the test inputs imply.'
  expected_verdict: REPRODUCED
  measure:
    file: amber-dprecorder/metrics.json
    regex: '"invariance_violations_flagged": ([0-9]+)'
- metric: sensitivity_violations_flagged
  threshold: == 3
  unit: caught sensitivity violations
  source: 'Paper Section 3.2 (p.471): "If the empirical distance between them exceeds the declared sensitivity
    ... a sensitivity violation is flagged"; Sections 4.3.1 SmartNoise SDK (p.474), 4.3.3 Synthcity (p.475)
    and 4.3.9 pathological inputs (p.477); artifact appendix Experiment 2.'
  measurement_protocol: 'Run `pytest tests/test_sensitivity_miscalibration.py tests/test_noise_miscalibration.py
    tests/test_nan_injection.py -v -s`. A test counts only if junit and the log both say PASSED and its log
    block holds exactly one "Call i (Laplace): Dist X > Sens Y" with X > Y and (X, Y) equal to the values the
    test inputs imply: (97, 5) for a sum over raw instead of clipped data, (1, 0) for the PrivBayes
    K == n_features scale collapse, (inf, 5) for a NaN that slips through np.clip.'
  expected_verdict: REPRODUCED
  measure:
    file: amber-dprecorder/metrics.json
    regex: '"sensitivity_violations_flagged": ([0-9]+)'
- metric: control_false_positives
  threshold: == 0
  unit: failing control tests
  source: 'Artifact appendix "Testing the Environment": `pytest`, "The tests should pass"; tests/test_correct_mechanism.py
    ("provides a passing reference example for the auditor"). Paper Section 4.3.10 (p.477) reports correct
    libraries where the audit found no violation.'
  measurement_protocol: 'Run the whole suite (`pytest tests -v -s`). It must collect exactly the seven test
    files'' tests. The value is 1 if test_correct_count_mechanism (a correct Laplace count, sensitivity 1,
    neighbour differs by one record) fails in junit or the log, else 0. Shows the auditor does not flag a
    correct mechanism.'
  expected_verdict: REPRODUCED
  measure:
    file: amber-dprecorder/metrics.json
    regex: '"control_false_positives": ([0-9]+)'
- metric: double_spending_budget_exceeded
  threshold: == 1
  unit: boolean
  source: 'Paper Section 4.3.6 MOSTLY AI (p.476): "Only a single budget is accounted for, although both routines
    add Laplace noise ... the actual privacy cost is 2ε even though the system reports ε"; Section 3.3
    Re:cord-play-sample; artifact appendix Experiment 3.'
  measurement_protocol: 'Run `pytest tests/test_double_spending.py -v -s`. Two Laplace queries each spend the
    full epsilon = 1 while the pipeline claims 1 in total. Re:cord-play-sample draws 10,000 samples of the
    isolated trace, composes the empirical PLDs and reads epsilon at delta = 1e-5. The value is 1 only if the
    test PASSED and its log holds the caught "Privacy budget exceeded!" assertion.'
  expected_verdict: REPRODUCED
  measure:
    file: amber-dprecorder/metrics.json
    regex: '"double_spending_budget_exceeded": ([0-9]+)'
- metric: double_spending_empirical_epsilon
  threshold: '> 1.0'
  unit: epsilon at delta = 1e-5
  source: 'Artifact appendix Experiment 3: "the empirical Epsilon is significantly higher than the target
    Epsilon (e.g., Target Epsilon: 1.0 | Empirical Epsilon: 1.98)"; paper Section 4.3.6 (p.476).'
  measurement_protocol: 'The "Empirical Epsilon" the test prints (2 dp) in the same run; exactly one such line
    and a finite value are required. Threshold is the declared budget of 1.0. The RNG is unseeded, so the
    value varies between runs; it is recorded for drift, only the bound is judged.'
  expected_verdict: REPRODUCED
  notes: 'The analytic composition of the two Laplace(1) mechanisms (dp_accounting PLD) is epsilon = 2.0000 at
    delta = 1e-5; the empirical estimate sits below it (1.55-1.75 observed).'
  measure:
    file: amber-dprecorder/metrics.json
    regex: '"double_spending_empirical_epsilon": ([0-9.]+)'
