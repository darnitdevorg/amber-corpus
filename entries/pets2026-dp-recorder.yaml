    REQ
    amber-dprecorder/venv/bin/pip install --quiet --no-input --only-binary :all: --require-hashes -r amber-dprecorder/requirements.txt
    amber-dprecorder/venv/bin/python -c "import sys; from importlib.metadata import version as v; assert sys.version_info[:2] == (3, 11); print(sys.version.split()[0], *(p + '==' + v(p) for p in ('numpy', 'scipy', 'dp-accounting', 'pytest')))" > amber-dprecorder/versions.log
    run() {  # the appendix's pytest commands; -s prints each caught violation; exit codes go to the checker
      n=$1; shift
      PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 MPLBACKEND=Agg amber-dprecorder/venv/bin/python -m pytest -v -s -p no:cacheprovider --junitxml="amber-dprecorder/$n.xml" "$@" > "amber-dprecorder/$n.log" 2>&1 && s=0 || s=$?
      echo "$n $s" >> amber-dprecorder/status.txt
    }
    run exp1 tests/test_buggy_private_mean.py tests/test_domain_inference.py
    run exp2 tests/test_sensitivity_miscalibration.py tests/test_noise_miscalibration.py tests/test_nan_injection.py
    run exp3 tests/test_double_spending.py
    run suite tests
    python3 -I - amber-dprecorder <<'PYTHON' > amber-dprecorder/metrics.json
    import json, math, pathlib, re, sys, xml.etree.ElementTree as ET
    root = pathlib.Path(sys.argv[1])
    EXP = {'exp1': ['test_buggy_private_mean::test_invariant_violation', 'test_domain_inference::test_domain_inference_bug'],
           'exp2': ['test_sensitivity_miscalibration::test_sensitivity_bug', 'test_noise_miscalibration::test_noise_miscalibration_bug', 'test_nan_injection::test_nan_injection_bug'],
           'exp3': ['test_double_spending::test_accounting_bug']}
    EXP['suite'] = sorted(EXP['exp1'] + EXP['exp2'] + EXP['exp3'] + ['test_correct_mechanism::test_correct_count_mechanism'])
    status = dict(l.split() for l in (root/'status.txt').read_text().splitlines())
    assert sorted(status) == sorted(EXP) and all(s in ('0', '1') for s in status.values()), 'missing run or pytest usage/collection error'
    passed, seg = {}, {}
    for n, tests in EXP.items():
        xml = ET.parse(root/(n + '.xml')).getroot()
        assert all(s.get('errors') == '0' for s in xml.iter('testsuite')), n + ': collection/setup errors'
        got = {}
        for tc in xml.iter('testcase'):
            k = tc.get('classname').split('.')[-1] + '::' + tc.get('name')
            assert k not in got, n + ': duplicate test'
            got[k] = not any(c.tag in ('failure', 'error', 'skipped') for c in tc)
        assert sorted(got) == sorted(tests), n + ': wrong test set'
        log = (root/(n + '.log')).read_text()
        assert 'Traceback' not in log, n + ': traceback in log'
        starts = [(m.start(), m[1] + '::' + m[2]) for m in re.finditer(r'(?m)^tests/(\w+)\.py::(\w+) ', log)]
        assert sorted(k for _, k in starts) == sorted(tests), n + ': log does not list exactly its tests'
        ends = [s for s, _ in starts[1:]] + [log.index('\n- generated xml file', starts[-1][0])]
        for (s, k), e in zip(starts, ends):
            ok = log[s:e].rstrip().endswith('PASSED')
            assert ok == got[k], n + ': log and junit disagree on ' + k
            passed[n, k], seg[n, k] = ok, log[s:e]
    EQ = {'test_buggy_private_mean::test_invariant_violation': 'n', 'test_domain_inference::test_domain_inference_bug': 'num_classes'}
    def eq_hit(k):
        m = re.findall(r"Equality Failure @ '(\w+)' \(Call \d+\)\n\s+Record \(D\) : (\S+)\n\s+Replay \(D'\): (\S+)", seg['exp1', k])
        return passed['exp1', k] and m == [(EQ[k], '3', '2')]
    SENS = {'test_sensitivity_miscalibration::test_sensitivity_bug': (97.0, 5.0), 'test_noise_miscalibration::test_noise_miscalibration_bug': (1.0, 0.0), 'test_nan_injection::test_nan_injection_bug': (math.inf, 5.0)}
    def sens_hit(k):
        m = [(float(d), float(s)) for d, s in re.findall(r'Call \d+ \(Laplace\): Dist (\S+) > Sens (\S+)', seg['exp2', k])]
        return passed['exp2', k] and len(m) == 1 and m[0][0] > m[0][1] and m[0] == SENS[k]
    k3 = EXP['exp3'][0]
    eps = re.findall(r'Target Epsilon: 1\.0 \| Empirical Epsilon: (\S+)', seg['exp3', k3])
    assert len(eps) == 1 and math.isfinite(float(eps[0])), 'missing empirical epsilon'
    print(json.dumps({
        'invariance_violations_flagged': sum(map(eq_hit, EQ)),
        'sensitivity_violations_flagged': sum(map(sens_hit, SENS)),
        'control_false_positives': int(not passed['suite', 'test_correct_mechanism::test_correct_count_mechanism']),
        'double_spending_budget_exceeded': int(passed['exp3', k3] and 'Caught expected AssertionError:\nPrivacy budget exceeded!' in seg['exp3', k3]),
        'double_spending_empirical_epsilon': float(eps[0]),
    }, sort_keys=True))
    PYTHON
