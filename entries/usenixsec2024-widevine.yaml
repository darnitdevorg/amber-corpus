  notes: |
    Appendix A.2.3: "Running our artifact does not require any specific hardware."
    The authors used a 16 GB laptop; this is not a measured minimum.
    Appendix A.4.2 describes proofs taking seconds to minutes:
    https://secartifacts.github.io/usenixsec2024/appendix-files/sec24winterae-final20.pdf.
    The numeric resource fields are execution budgets for the selected subset:
    2 GiB aggregate RSS plus swap sampled every 0.1 s, 3 GiB checkout/output budget,
    300 s wall/CPU per proof, 64 MiB per file, 128 MiB combined output per proof.
    The GHC runtime uses one worker and a 1 GiB heap cap; symbolic inputs and proof
    strategy are unchanged. The memory watcher conservatively sums process RSS,
    which can count shared pages more than once; it is not a cgroup hard limit.
    First captures on 2026-10-26, Ubuntu 24.04.4 / AMD Ryzen 5 6600H / 15166 MiB RAM:
    executability 28.84 s, 345808896 B sampled aggregate peak RSS; renewal 119.38 s,
    1159729152 B sampled aggregate peak RSS, no sampled swap. GNU time measured
    1106888 KiB maximum RSS for the renewal command. Retained local dependencies,
    downloads (including one interrupted transfer), sources and first captures
    occupied about 68 MiB; setup did not require a compiler or container.
    The exact command below also passed from a second fresh checkout in 148.57 s
    (executability 29.26 s, renewal 118.95 s). Both complete summaries were checked
    independently again; all ten declared outputs were captured.
    Prerequisites: Linux x86_64 with /proc, Git, Python 3.9+, GNU /usr/bin/time,
    Tamarin 1.8.0 and Maude 3.3.1 on PATH. Headless batch proving does not render
    graphs. The author oracle emits Python 3.12 SyntaxWarning messages about legacy
    regex string escapes; these diagnostics and its verbose progress are retained
    in stderr.log. The analyzed proof output contains no Tamarin warnings or sorry
    proofs; all expected lemma outcomes are checked explicitly.
    Install the official tools in a new isolated dependency directory:
      curl -fL --max-time 360 --max-filesize 16777216 -o tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.8.0/tamarin-prover-1.8.0-linux64-ubuntu.tar.gz
      curl -fL --max-time 360 --max-filesize 16777216 -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.3.1/Maude-linux.zip
      echo '2bed5d3a5b7ad7b39a96fd1892246f4645a87d754498106c2466df5b4b26ce88  tamarin.tar.gz' | sha256sum -c -
      echo '9837c4bd0be1adea5d2dea0c72837367d173e7e98fe34722a9175e2e044f139c  maude.zip' | sha256sum -c -
      tar -xzf tamarin.tar.gz
      unzip -q maude.zip
      chmod +x Linux64/maude.linux64
      ln -s maude.linux64 Linux64/maude
      export PATH="$PWD:$PWD/Linux64:$PATH"
      export MAUDE_LIB="$PWD/Linux64"
    Keep that environment, clone artifact.clone into a different directory, check
    out artifact.ref, and run the command from the clean artifact root. A new
    amber-widevine output directory is required. The command itself is offline;
    network_required describes public source/tool retrieval. Record setup storage
    alongside the checkout; the monitor inside the command measures the checkout
    and its outputs. This is only the patched desktop renewal subset, not the full
    paper, an attack replay, a timing claim, or a test of deployed Widevine software.
role: positive
