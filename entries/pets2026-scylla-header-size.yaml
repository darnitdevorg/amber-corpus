  machine: AMD Ryzen 5 6600H (6 cores / 12 threads), 15166 MiB RAM; Ubuntu 24.04.4 x86_64, Linux 7.0.0-43-generic; rustc
    1.93.0, Python 3.12.3
  outputs:
  - path: amber-scylla/versions.log
    sha256: 58deb95de11f23ddb1e2e9b0314334d79c60c67cea111256b3a562c43f6b554c
  - path: amber-scylla/sphinx-Cargo.lock
