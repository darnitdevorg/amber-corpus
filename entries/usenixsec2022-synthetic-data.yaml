  runtime_minutes: 75      # appendix estimate for the linkage example, not measured here
  docker: true             # optional; direct Python installation is also documented
  network_required: true   # setup downloads packages/images and CTGAN source
  notes: >
    Appendix A.2 estimates 75 minutes for the linkage example and three hours
    for all examples on an Intel i7-7600U with two cores and hyperthreading.
    Preparation is estimated below one hour, depending on download bandwidth.
    The Docker image needs approximately 14 GB; the output-space sentence is
    incomplete, so total disk usage is unknown. GPUs accelerate PATE-GAN/CTGAN
    but are not required for the example experiments. README.md:25 and 51-58
    document Python 3.9, a CUDA-containing image and native setup. No images,
    research dependencies or experiments were executed during this audit.

