observed:
  - date: 2026-10-23
    tool: "darnit --framework amber (darnit-core/darnit-amber 0.1.0; commit 037b53c4a759bafe0e32ca3cfe3e2c41f3d690fe)"
    scope: "hygiene audit only; CLI without LLM consultation; claim verification not run"
    command: "/tmp/amber-gigadoram-wutdIC/darnit/.venv/bin/darnit audit /tmp/amber-three-p3Xad2/synthetic-data-artifact --framework amber --output json"
    exit_code: 1
    result: "Total 5 | Pass 0 | Fail 1 | Warn 4"
    note: >
      Reused the clean isolated tool checkout installed with uv sync --frozen
      --no-dev --package darnit-amber and Python 3.12.3. All five controls and
      handlers were verified before the audit; pass_history confirms each ran.
      Default configuration; no artifact submodules. Exit 1 represents the
      HermeticBuild FAIL, not a setup failure. No ERROR, N/A or pending-LLM
      results. Three controls reached manual fallback; DependenciesPinned
      returned WARN directly and HermeticBuild returned FAIL directly.

      RE-01.01 DependenciesPinned (WARN): requirements.txt:1-10 pins ten
      direct packages with == but contains no hashes or transitive lock.
      The finding is supported. README.md:64-70 additionally asks users to
      install CTGAN from an unpinned repository; that dependency is outside
      the handler's root requirements inspection.

      RE-01.02 BuildEnvDeclared (WARN): the handler reports no environment
      declaration, missing docker/Dockerfile because its container lookup
      only checks root Dockerfile/Containerfile. docker/Dockerfile:1 declares
      CUDA 11.4.2 on Ubuntu 20.04 using a tag, not an immutable digest.
      README.md:25 describes the packaged environment. WARN is reasonable
      for incomplete pinning, but absence of an environment declaration is
      an inaccurate explanation caused by file discovery.

      RE-02.01 HermeticBuild (FAIL): this handler does scan docker/Dockerfile
      and flags pip install. Lines 24-28 upgrade pip/wheel and install packages
      without an offline source; lines 30-34 clone CTGAN and this project
      without fixed revisions and install CTGAN. This supports the reported
      possible live-fetch finding. apt-get install is separately deferred
      as image setup. The scan stops after the first violation in each file,
      so the report is not an exhaustive inventory. No build/network trace
      was executed; this is static evidence, not an observed network event.

      RE-02.02 ProvenanceExists (WARN): files_checked is empty, with no CI
      provenance signals. No CI workflows, local attestations or signing
      configuration were found in the pinned checkout. Remote releases and
      image provenance were not verified; absence elsewhere is not established.

      RE-03.01 BitForBitReproducible (WARN): no signals found; files_checked
      is empty. No independent-build hash comparison, reprotest/diffoscope
      configuration or reproducibility workflow was found. Builds were not
      run, so binary reproducibility remains unknown. Appendix A.6 also warns
      about statistical variation in research results, a different question.

      Witness verification is unavailable in this unchanged tool environment:
      a separate import check confirmed SIGSTORE_VERIFY_AVAILABLE is false.
      witness_attestation.py returns before a remote lookup in that case;
      the audit JSON does not expose that prerequisite failure. No remote
      attestation or authentication check was performed. Stderr also reports
      the known nonfatal package amber versus distribution darnit-amber
      verification warning; it did not prevent handler execution.
      Raw JSON, stderr and command/timestamp/revision/hash metadata remain
      local in gitignored downloads/synthetic-data-audit-2026-10-23/.
      Neither the FAIL nor the WARN results demonstrate failure to reproduce
      the paper's scientific claims; those claims remain unevaluated here.
