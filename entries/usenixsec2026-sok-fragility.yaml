  - path: amber-fragility/def_tbl.stderr.log
    sha256: 113c53906f8bb3ce114643040650610dbc1ad127e8889d67067b43a10631ab62
  - path: amber-fragility/cla_results.txt
    sha256: ec59a1971869680fceb9f509982619f6058f353e0c4801cea9da014c399cd32d
