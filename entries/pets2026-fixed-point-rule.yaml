# Verified subset: artifact Experiment 3 only (epsilon_split_experiment.ipynb), the rule of thumb
# for splitting the privacy budget in Appendix F: Table 3, the fitted A/B/K, the crime-dataset
# optimality gaps of Figure 8 and the worst gap over all three canonical datasets.
# Experiments 1, 2, 4 and 5 are excluded; see resources.notes.
id: pets2026-fixed-point-rule
title: Preserving Target Distributions With Differentially Private Count Mechanisms
venue:
  name: PETS
  year: 2026
paper:
  url: https://petsymposium.org/popets/2026/popets-2026-0063.pdf
  doi: 10.56553/popets-2026-0063
artifact:
  url: https://github.com/nitinkohli/fixed_point_privacy/tree/dbbf3ce302142f56c3740e052c0216eb6af6917b
  clone: git clone https://github.com/nitinkohli/fixed_point_privacy.git && cd fixed_point_privacy && git checkout
    dbbf3ce302142f56c3740e052c0216eb6af6917b, then run run.command in the checkout root.
  ref_type: commit
  ref: dbbf3ce302142f56c3740e052c0216eb6af6917b
  license: MIT
badges:
- available
- functional
- reproduced
resources:
  cpu_only: true
  ram_gb: 1
  disk_gb: 1
  runtime_minutes: 15
  docker: false
  network_required: true
  notes: |
    The artifact appendix is ARTIFACT-APPENDIX.md in the repository. Experiment 3
    (epsilon_split_experiment.ipynb) "generates the values in Table 3 and Figure 8 ... The
    compute time of this is 20 minutes". Hardware: "an Apple M2 laptop with 8 GB of memory";
    "The space consumed by the artifact is 476 MB." The AEC row (issue 2026.2) awards
    available, functional and reproduced and pins this commit:
    https://secartifacts.github.io/pets2026/results.

    Tested: the unmodified notebook, every code cell run in order in one namespace (what
    Jupyter's "Run All Cells" does), skipping only the `%matplotlib inline` magic line, with
    MPLBACKEND=Agg. The notebook seeds numpy's global RNG (np.random.seed(42)) before each
    simulation block, and the Table 3 path (cyclic Laplace plus Algorithm 1 with the sandwich
    selector) draws only from that RNG, so the run is deterministic. After the cells finish,
    the runner writes optimal_f.unstack(0) to table3.csv (the authors' own commented-out export
    in the notebook), the notebook's fitted A/B/K to fit.json, and the four raw result frames.
    The checker reads the "measured optimality gap" lines the notebook prints.

    Excluded: Experiment 1 (dataset figures), Experiment 2 (Figure 3, no numeric threshold),
    Experiment 4 (Figures 5/6, 75 compute-minutes; the 94% / 74% / 87% Wasserstein decreases in
    Section 6.1 are read off that run and are not tested here) and Experiment 5 (wall-clock
    runtimes, hardware dependent). This entry makes no claim about those.

    Protocol note: Appendix F says "we perform 100 simulations" per combination for Table 3,
    but the notebook uses replications=20 for that block (100 for the Figure 8 blocks). The
    notebook's stored output, produced with 20, is exactly the printed Table 3, so the entry
    tests the artifact's protocol as shipped.

    Native, no uv or Jupyter: a Python 3 venv with hash-pinned wheels. Versions and sha256 are
    taken from the artifact's own uv.lock (cp312 manylinux x86_64) for the 20 packages the
    notebook imports, directly or transitively; ipykernel and its dependencies are left out
    because nothing runs through a kernel. The authors ran Python 3.11.5 (notebook metadata) on
    macOS; Python 3.12.3 on Linux was tested here. The command refuses a different commit or
    any edit to tracked files (git diff --quiet).

    First capture on 2026-11-14 in a fresh clone: exit 0, 9 min 57 s wall including venv
    setup, 311172 KiB peak RSS (GNU time), under a 3 GiB memory cap with swap disabled, nothing
    on stderr. All 66 Table 3 cells, A/B/K, the four crime gaps and the worst gap match the paper.
    The 12 printed gaps, the A/B/K line and Table 3 are also identical to the outputs stored in
    the authors' notebook. The notebook's fit gives A = 0.63902690, B = 0.10612209,
    K = 2.86916462, equal to the constants hard-coded in pets_utilities.rule_of_thumb to 1e-9.

    An independent validator re-derived everything another way, without the checker's parsing.
    It rebuilt Table 3 from the raw per-split results (594 rows, argmin of the combined objective
    in plain Python: 66/66) and refitted A/B/K with scipy least_squares from 27 starting points
    plus a grid. That gave A = 0.63904, B = 0.10612, K = 2.86928; the objective is flat there
    (SSE 0.6343100058 vs 0.6343100060 for the authors' constants), so the two optima differ by
    1.1e-4 and agree at printed precision. It recomputed all 12 gaps from the raw binomial, crime
    and schools frames (crime 0.023945, 0.046360, 0.016878, 0; binomial eps 0.1 = 0.41632, the
    maximum) and checked the six synthetic datasets against Appendix F (sizes 3000, 10000, 10000,
    20000, 10000, 10000; supports 30, 70, 70, 40, 80, 80). All 32 checks passed and its 10 values
    equal the checker's. The checker rejected or failed 24 incomplete or invalid fixtures (missing
    or empty files, dropped, duplicated or shifted rows, renamed or dropped datasets, altered,
    out-of-range or NaN cells, perturbed or NaN A/B/K, altered, dropped, duplicated or unlabelled
    gap lines, a lowered binomial gap, tracebacks) and accepted only the genuine output.

    The literal run.command, parsed from this file, passed in a second fresh clone on 2026-11-14:
    exit 0, 9 min 44 s wall, 313656 KiB peak RSS, 651 MB workspace (checkout, venv, captures).
    Same ten metrics; validator, all 24 fixtures and a replay of every measure block re-confirmed.
    A wrong commit, an edited pets_utilities.py and an edited notebook each stopped the command
    before amber-fixedpoint/ was created. Baseline hashes below are from this fresh run.
    versions.log, run.log, run.stderr.log (empty), table3.csv, fit.json and metrics.json were
    byte-identical to the first capture. The four raw result CSVs differ only in their
    wall-clock runtime column; every simulated value is identical.

    Prerequisites: Linux x86_64, POSIX shell, git, Python 3.12 with venv, and network access
    to GitHub and PyPI. The experiment itself is offline.
role: positive
expected_verdict: REPRODUCED
claims:
- metric: table3_cells_matched
  threshold: == 66
  unit: table cells
  source: Paper Appendix F, Table 3 "Optimal values of f for each of our synthetic datasets" (p.640); artifact
    Experiment 3.
  measurement_protocol: 'Run the notebook unmodified. For each of the six synthetic datasets and 11 total budgets
    eps_t (log-spaced 0.1..5), the notebook simulates the two-stage framework for f = 0.1..0.9 and picks the f
    minimising log(mean L1 noise) + log(mean Wasserstein). Parse table3.csv (optimal_f.unstack(0)): it must have
    exactly the six dataset columns, exactly the 11 eps_t rows of Table 3 (compared at 2 dp) and every value in
    [0.1, 0.9]. Count cells equal to Table 3 at its printed 1 dp. No tolerance.'
  expected_verdict: REPRODUCED
  notes: Covers the whole table, not a sample.
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"table3_cells_matched": ([0-9]+)'
- metric: fit_A
  threshold: == 0.639
  unit: f (fraction of budget)
  source: 'Paper Appendix F (p.641): "We fit these parameters to the data in Table 3, yielding values A = 0.639,
    B = 0.106, and K = 2.87."'
  measurement_protocol: The notebook's own fit_exp_decay_multiindex (scipy curve_fit of f = B + (A - B) exp(-K
    eps_t), 0 <= A, B <= 1, K > 0) on the regenerated Table 3; A rounded to the paper's 3 dp.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"fit_A": ([0-9.]+)'
- metric: fit_B
  threshold: == 0.106
  unit: f (fraction of budget)
  source: Paper Appendix F (p.641), "B = 0.106".
  measurement_protocol: As fit_A; B rounded to 3 dp.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"fit_B": ([0-9.]+)'
- metric: fit_K
  threshold: == 2.87
  unit: 1 / eps_t
  source: Paper Appendix F (p.641), "K = 2.87".
  measurement_protocol: As fit_A; K rounded to the paper's 2 dp.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"fit_K": ([0-9.]+)'
- metric: crime_gap_eps_0_1
  threshold: == 0.024
  unit: log-objective difference
  source: 'Paper Appendix F and Figure 8 (p.641): "as eps_t increases from 0.1 to 0.5, 1.0, and 5.0, the
    corresponding optimality gap changes from 0.024 to 0.046, 0.017, and 0".'
  measurement_protocol: 'Crime dataset block of the notebook (100 simulations per f, f in 0.1..0.9 plus the
    rule-of-thumb f). Gap = objective at the rule-of-thumb f minus the minimum objective over all f tested, as
    the notebook prints it ("At total epsilon of X the measured optimality gap is Y", 3 dp). The checker
    attributes each printed gap to the dataset named by the preceding "testing <dataset>" line and requires
    exactly one gap per (dataset, eps_t) for binomial, crime and schools at eps_t = 0.1, 0.5, 1, 5.'
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"crime_gap_eps_0_1": ([0-9.]+)'
- metric: crime_gap_eps_0_5
  threshold: == 0.046
  unit: log-objective difference
  source: Paper Appendix F and Figure 8 (p.641), as crime_gap_eps_0_1.
  measurement_protocol: As crime_gap_eps_0_1, at eps_t = 0.5.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"crime_gap_eps_0_5": ([0-9.]+)'
- metric: crime_gap_eps_1
  threshold: == 0.017
  unit: log-objective difference
  source: Paper Appendix F and Figure 8 (p.641), as crime_gap_eps_0_1.
  measurement_protocol: As crime_gap_eps_0_1, at eps_t = 1.0.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"crime_gap_eps_1": ([0-9.]+)'
- metric: crime_gap_eps_5
  threshold: == 0.0
  unit: log-objective difference
  source: Paper Appendix F and Figure 8 (p.641), as crime_gap_eps_0_1 ("... and 0").
  measurement_protocol: As crime_gap_eps_0_1, at eps_t = 5.0.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"crime_gap_eps_5": ([0-9.]+)'
- metric: max_optimality_gap
  threshold: == 0.42
  unit: log-objective difference
  source: 'Paper Appendix F (p.641): "The worst optimality gap we observe across all experiments is for the
    binomial data at eps_t = 0.1, with a value of 0.42."'
  measurement_protocol: Maximum of the 12 printed gaps (binomial, crime, schools at eps_t = 0.1, 0.5, 1, 5),
    rounded to the paper's 2 dp.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"max_optimality_gap": ([0-9.]+)'
- metric: max_gap_is_binomial_eps_0_1
  threshold: == 1
  unit: boolean
  source: Paper Appendix F (p.641), as max_optimality_gap.
  measurement_protocol: 1 if the largest of the 12 printed gaps is the binomial dataset at eps_t = 0.1, else 0.
  expected_verdict: REPRODUCED
  measure:
    file: amber-fixedpoint/metrics.json
    regex: '"max_gap_is_binomial_eps_0_1": ([01])'
run:
