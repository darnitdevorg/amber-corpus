    pywavelets==1.9.0 --hash=sha256:573b650805d2f3c981a0e5ae95191c781a722022c37a0f6eba3fa7eae8e0ee17
    scipy==1.16.3 --hash=sha256:72d1717fd3b5e6ec747327ce9bda32d5463f472c9dce9f54499e81fbd50245a1
    seaborn==0.13.2 --hash=sha256:636f8336facf092165e27924f223d3c62ca560b1f2bb5dff7ab7fad265361987
    six==1.17.0 --hash=sha256:4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
    tzdata==2025.2 --hash=sha256:1a403fada01ff9221ca8044d701868fa132215d84beb92242d9acd2147f667a8
    wrapt==2.0.1 --hash=sha256:7b219cb2182f230676308cdcacd428fa837987b89e4b7c5c9025088b8a6c9faf
    REQ
    amber-fixedpoint/venv/bin/pip install --quiet --no-input --only-binary :all: --require-hashes -r amber-fixedpoint/requirements.txt
    amber-fixedpoint/venv/bin/python -c "import sys; from importlib.metadata import version as v; print(sys.version.split()[0], *(p + '==' + v(p) for p in ('numpy', 'scipy', 'pandas', 'opendp')))" > amber-fixedpoint/versions.log
    MPLBACKEND=Agg MPLCONFIGDIR="$PWD/amber-fixedpoint/mpl" amber-fixedpoint/venv/bin/python - epsilon_split_experiment.ipynb amber-fixedpoint <<'RUN' > amber-fixedpoint/run.log 2> amber-fixedpoint/run.stderr.log
    import json, sys
    nb, out = json.load(open(sys.argv[1])), sys.argv[2]
    ns = {'__name__': '__main__'}
    for cell in nb['cells']:  # Jupyter "Run All Cells"; only the %matplotlib magic is skipped
        if cell['cell_type'] == 'code':
            exec(''.join(l for l in cell['source'] if not l.startswith('%')), ns)
    ns['optimal_f'].unstack(0).to_csv(f'{out}/table3.csv')
    json.dump({k: float(ns['res'][k]) for k in 'ABK'}, open(f'{out}/fit.json', 'w'))
    for name in ['epsilon_split_res', 'binom_epsilon_split_res', 'crime_epsilon_split_res', 'schools_epsilon_split_res']:
        ns[name].to_csv(f'{out}/{name}.csv', index=False)
    RUN
    python3 -I - amber-fixedpoint <<'PYTHON' > amber-fixedpoint/metrics.json
    import csv, json, math, pathlib, re, sys
    root = pathlib.Path(sys.argv[1])
    log = (root/'run.log').read_text()
    assert not re.search(r'Traceback|Error', log + (root/'run.stderr.log').read_text()), 'run reports an error'
    TABLE3 = {'uniform': '.8 .8 .4 .3 .3 .2 .2 .1 .1 .1 .1', 'left-skewed': '.4 .3 .3 .3 .2 .2 .1 .1 .1 .1 .1',
              'right-skewed': '.5 .4 .3 .2 .2 .2 .2 .1 .1 .1 .1', 'bimodal': '.7 .8 .5 .4 .3 .3 .1 .1 .1 .1 .1',
              'zero-inflated': '.3 .3 .3 .2 .2 .2 .1 .1 .1 .1 .1', 'top-inflated': '.4 .3 .3 .3 .3 .2 .2 .1 .1 .1 .1'}
    EPS = [0.10, 0.15, 0.22, 0.32, 0.48, 0.71, 1.05, 1.55, 2.29, 3.38, 5.00]
    rows = list(csv.reader(open(root/'table3.csv', newline='')))
    assert rows[1][0] == 'dataset' and rows[2][0] == 'total_epsilon' and len(rows) == 3 + len(EPS), 'table3 shape'
    names = rows[1][1:]
    assert sorted(names) == sorted(TABLE3) and len(names) == 6, 'table3 datasets'
    assert [round(float(r[0]), 2) for r in rows[3:]] == EPS, 'table3 epsilons'
    got = {n: [float(r[1 + j]) for r in rows[3:]] for j, n in enumerate(names)}
    assert all(math.isfinite(v) and 0.1 <= v <= 0.9 for c in got.values() for v in c), 'table3 values'
    matched = sum(round(v, 1) == float(w) for n in TABLE3 for v, w in zip(got[n], TABLE3[n].split()))
    fit = json.loads((root/'fit.json').read_text())
    assert all(math.isfinite(fit[k]) for k in 'ABK'), 'fit values'
    gaps, dataset = {}, None
    for m in re.finditer(r'testing (\S+)|At total epsilon of (\S+) the measured optimality gap is (\S+)', log):
        if m.group(1):
            dataset = m.group(1)
        else:
            assert (dataset, float(m.group(2))) not in gaps, 'duplicate gap'
            gaps[dataset, float(m.group(2))] = float(m.group(3))
    assert set(gaps) == {(d, e) for d in ('binomial', 'crime', 'schools') for e in (0.1, 0.5, 1.0, 5.0)}, 'gap lines'
    assert all(math.isfinite(g) and g >= 0 for g in gaps.values()), 'gap values'
    worst = max(gaps, key=gaps.get)
    print(json.dumps({
        'table3_cells_matched': matched,
        'fit_A': round(fit['A'], 3), 'fit_B': round(fit['B'], 3), 'fit_K': round(fit['K'], 2),
        'crime_gap_eps_0_1': gaps['crime', 0.1], 'crime_gap_eps_0_5': gaps['crime', 0.5],
        'crime_gap_eps_1': gaps['crime', 1.0], 'crime_gap_eps_5': gaps['crime', 5.0],
        'max_optimality_gap': round(gaps[worst], 2),
        'max_gap_is_binomial_eps_0_1': int(worst == ('binomial', 0.1)),
    }, sort_keys=True))
    PYTHON
