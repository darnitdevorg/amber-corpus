# Verified subset: the whole artifact.ipynb run on the bundled survey data. Judged: the sample size, Table 3
# (demographic counts), Table 4 (113 of 114 cells), the Sec. 4.1-4.3 awareness / preference / discoverability rates,
# the Sec. 4.4 correlations, the Table 6 and Table 7 OLS rows, and Table 5 (OS counts). Two paper cells that already
# disagree with the authors' own shipped output, the figures and the Appendix B.5 models are excluded; see resources.notes.
id: pets2025-social-media-privacy
title: 'Navigating Social Media Privacy: Awareness, Preferences, and Discoverability'
venue:
  name: PETS
  year: 2025
paper:
  url: https://petsymposium.org/popets/2025/popets-2025-0148.pdf
  doi: 10.56553/popets-2025-0148
artifact:
  url: https://github.com/STEELISI/Social-Media-Privacy-Awareness-Preferences-Discoverability/tree/81bf39637d8877b23ab6a881c9941e1013c5a651
  clone: |
    git clone https://github.com/STEELISI/Social-Media-Privacy-Awareness-Preferences-Discoverability.git artifact,
    then `git -C artifact checkout 81bf39637d8877b23ab6a881c9941e1013c5a651` and run run.command from inside artifact/.
  ref_type: commit
  ref: 81bf39637d8877b23ab6a881c9941e1013c5a651
  license: MIT
badges:
- available
- functional
- reproduced
resources:
  cpu_only: true
  ram_gb: 1
  disk_gb: 1
  runtime_minutes: 5
  docker: false
  network_required: true
  notes: |
    Artifact README at the pinned commit:
    - "No special hardware requirements (can run on a local laptop)."
    - "The survey data (stored in raw) is around 700KB and running the Python notebook (artifact.ipynb) should
      complete within a few minutes."
    - "We run the artifact using Python 3.8.11."
    - "We reproduce ALL results presented in the paper."
    Badges: https://secartifacts.github.io/pets2025/results ("available, functional, reproduced"). The pin is the
    secartifacts commit. The only later commit, 55b3037, edits one README line.

    Tested: all 36 code cells of artifact.ipynb, unmodified and in order, in one Python namespace, on the six bundled
    CSVs (541 screened responses). As in Jupyter, a cell's trailing bare expression is displayed: DataFrames via
    to_string(), so wide tables do not wrap, and None is not printed. The notebook's savefig calls are commented out
    upstream, so no figure files are written. Plots go to the Agg backend.

    What each claim compares (paper value vs the notebook's printed output):
    - Table 3: counts only. The paper's rows "Non-binary" = Non-binary + gender "Prefer not to say" and
      "<=High school" = less than high school + high school; only with these merges do the gender rows sum to n. The
      integer Table 3 percentages round half-even and are not judged.
    - Table 4: the notebook's "k/n (pp.pp %)" string, compared with the paper's two-decimal cell.
    - Sec. 4.1-4.3 rates: the notebook prints a two-decimal fraction, e.g. "75 (0.62%)". The paper's integer
      percentage equals that printed fraction x 100. Facebook "never seen multiple" is 75/120 = 0.625, printed 0.62,
      and the paper says 62% (half-up would give 63).
    - Correlations: r rounded half-up to 3 dp. p-values as the paper states them (< 0.001, < 0.0001, = 0.038; per
      platform, p <= 0.015 on every platform except TikTok).
    - Tables 6 and 7: SE, t and the 95% CI bounds must equal statsmodels' printed 3-dp values. beta matches when the
      printed 4-dp coef lies within 0.0005 of the paper's 3-dp value. The paper rounded the printed 4-dp value with
      float rounding: 0.1605 -> 0.161 and 0.2905 -> 0.290, while the full-precision values are 0.160476 and 0.290476.
      Half-up on the 4-dp print would misjudge the second. The os row of Table 6 reads "iOS (vs. Android)" while the
      notebook's reference level is iOS, so the printed Android coefficient, t and CI are negated.
    These comparison rules, every claim and every threshold were frozen before the first run, from the paper and the
    authors' shipped notebook outputs.

    Excluded before the first run (paper text vs the authors' own shipped output):
    - Table 4, X / message / "more private": the paper prints 11.67%. The shipped output and the rerun both give
      0/60. The raw answers to that question are 46 "satisfied" and 14 "more EXPOSED".
    - Table 6, age / A_TIME, t: the paper prints 2.000. The output gives 2.004 (beta 10.4996 / SE 5.240). That row's
      beta, SE and CI are judged.
    Not judged:
    - the p-value column of Tables 6 and 7 (statsmodels prints 3 dp, so "<0.0001" cannot be read; t carries it)
    - the significance stars
    - Figures 1-3 and 5-8
    - the Appendix B.5 interaction models (not in the notebook)
    - the manual UI-path validation and the 664 -> 541 screening (the CSVs are already screened)

    Native, no Docker or Jupyter. run.command builds a Python 3.11 venv with pip --require-hashes at the authors'
    requirements.txt versions for every package the notebook imports, plus their pinned dependencies (17 wheels;
    the Jupyter/IPython stack is not needed). The authors used Python 3.8.11; numpy 1.24.4, pandas 2.0.3, scipy
    1.10.1 and statsmodels 0.14.1 have no Python 3.12 wheels, hence 3.11. Prerequisites: Linux x86_64, git,
    python3.11 with venv, network access to PyPI. The analysis itself is offline and has no randomness. run.log
    is not byte-stable, because statsmodels prints the current date and time in every summary.

    First run on 2026-11-23, in a fresh clone under a 2 GiB memory cap with swap off: exit 0 in 23 s wall, 176 MiB
    peak RSS, empty stderr. All nine values equalled their frozen thresholds. Compared with the authors' shipped
    outputs, 12 of 14 stream-output cells are identical (Date/Time lines aside). The other two differ only in
    floating-point noise: the 16th significant digit of the correlations, and one unjudged intercept, 0.2312 vs
    0.2313.

    Independent validator (30/30 checks):
    - It reads the raw CSVs with the csv module.
    - It takes question numbers from the README's published tables and finds the demographic columns by their
      answer values.
    - It computes Pearson r by hand, and OLS by numpy normal equations with scipy t quantiles (equal to statsmodels
      to 1e-12).
    - It re-extracts every paper number from the PDF and agrees with the checker on all nine values.
    - It confirms that the checker's embedded paper values equal the PDF, that the two excluded cells come straight
      from the raw data (0.00% and t = 2.0036), and that the 0.290 cell is 0.290476 at full precision.

    The literal run.command, parsed from this YAML, passed again from a second fresh clone with no pip cache: exit 0
    in 30 s wall, 176 MiB peak RSS, about 464 MB on disk with the venv. metrics.json, versions.log and run.stderr.log
    were byte-identical to the first run, and run.log was identical apart from the Date/Time lines. Checker
    tests: 21 incomplete or invalid inputs were rejected (missing or empty or truncated logs, a missing marker,
    Traceback or Error on stderr, a dropped platform, table row, regression block or correlation, a shifted or
    blanked or non-numeric Table 4 cell, inconsistent counts, out-of-order cells). 11 value alterations with intact
    structure were written to metrics.json and judged NOT_REPRODUCED. A wrong commit, an edited notebook and an
    edited CSV each stop the command before amber-socialmedia/ is created.
role: positive
expected_verdict: REPRODUCED
claims:
- metric: n_participants
  threshold: == 541
  unit: participants
  source: Paper Sec. 3.4 ("kept 541 participants' responses for data analysis") and Table 3 (n=541)
  measurement_protocol: 'Code cell 14 prints "#rows: 541" for the combined analysis frame. The checker requires it to
    equal the sum of the per-platform row counts that code cell 0 prints for all six platforms (paper: 120 / 61 / 60 /
    120 / 120 / 60).'
  expected_verdict: REPRODUCED
  notes: The bundled CSVs are the paper's full screened sample.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"n_participants": ([0-9]+)'
- metric: table3_counts_matched
  threshold: == 182
  unit: Table 3 count cells (of 182)
  source: Paper Table 3, "Demographics of participant sample (n=541)"
  measurement_protocol: 'Integer counts of the 26 Table 3 rows x (6 platforms + Total), compared with df_demographic
    (code cell 3), using the paper''s two merged rows (see resources.notes).'
  expected_verdict: REPRODUCED
  notes: Age, gender, education, tech background and region per platform.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"table3_counts_matched": ([0-9]+)'
- metric: table4_cells_matched
  threshold: == 113
  unit: Table 4 cells (of 113 judged)
  source: Paper Table 4 (fraction who have never seen / prefer more private / find hard to locate, per setting and platform)
  measurement_protocol: 'Every non-dash Table 4 cell except X / message / more private, as a two-decimal percentage
    string, compared with the "k/n (pp.pp %)" cells of df_main (code cell 8). The checker also requires the same
    cell layout as the paper''s dashes.'
  expected_verdict: REPRODUCED
  notes: The core RQ1-RQ3 per-setting results. One cell is excluded (resources.notes).
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"table4_cells_matched": ([0-9]+)'
- metric: headline_rates_matched
  threshold: == 6
  unit: headline percentages (of 6)
  source: Paper Abstract and Secs. 4.1-4.3 (80% / 58% never seen at least one / multiple settings, 92% / 83% prefer
    more private defaults, 79% / 50% find settings hard to locate)
  measurement_protocol: The TOTAL lines of code cells 9-11, as printed two-decimal fractions x 100, compared with the
    paper's integer percentages.
  expected_verdict: REPRODUCED
  notes: The paper's main findings for RQ1-RQ3.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"headline_rates_matched": ([0-9]+)'
- metric: platform_rates_matched
  threshold: == 29
  unit: per-platform percentages stated in the text (of 29)
  source: Paper Secs. 4.1-4.3 (e.g. Instagram 93% / 66% never seen; Facebook 93% / 91% prefer more private; TikTok 55%
    / 23% hard to locate)
  measurement_protocol: 'The per-platform "at least one" / "multiple" lines of code cells 9-11, under the same rule as
    headline_rates_matched. Facebook "never seen multiple" (75/120 = 0.625, printed 0.62, paper 62%) is included.'
  expected_verdict: REPRODUCED
  notes: The Figure 1-3 breakdown values stated in the text.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"platform_rates_matched": ([0-9]+)'
- metric: correlation_values_matched
  threshold: == 10
  unit: correlation statements (of 10)
  source: Paper Sec. 4.4 (r 0.162, p < 0.001; r -0.328, p < 0.0001; r 0.089, p = 0.038; P_SEEN vs P_HARD significant on
    every platform except TikTok, -0.512 <= r <= -0.235, p <= 0.015)
  measurement_protocol: 'Pearson results printed by code cell 16. There are six pooled values (three r at 3 dp, three
    p statements) and four per-platform ones: the set of platforms with p < 0.05 is exactly the five other than
    TikTok; the min and max r of those five; their max p at 3 dp.'
  expected_verdict: REPRODUCED
  notes: RQ4.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"correlation_values_matched": ([0-9]+)'
- metric: table6_values_matched
  threshold: == 54
  unit: Table 6 values (11 rows x beta, SE, t, CI low, CI high, less one excluded t)
  source: Paper Table 6 and Sec. 4.5 (e.g. age P_SEEN beta -0.101; gender P_PRIVATE -0.079; usage frequency P_HARD
    0.069; #platforms P_SEEN 0.029)
  measurement_protocol: 'Single OLS summaries printed by code cells 20-23, one per dependent variable (P_SEEN,
    P_PRIVATE, P_HARD, A_TIME) and independent variable. Rules as in resources.notes, including the sign flip of the
    os row.'
  expected_verdict: REPRODUCED
  notes: RQ5 demographic and usage differences.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"table6_values_matched": ([0-9]+)'
- metric: table7_values_matched
  threshold: == 175
  unit: Table 7 values (35 rows x 5)
  source: Paper Table 7 and Sec. 4.6 (e.g. TikTok users find 9-32% fewer settings hard to locate, 0.089 <= |beta| <=
    0.316; Facebook users spend 35-39 s longer)
  measurement_protocol: 'Platform OLS summaries printed by code cells 24-27. Each "(REF vs.) IV" row is read from the
    REF platform''s summary, IV coefficient. Row blocks are P_SEEN 9, P_PRIVATE 8, P_HARD 12, A_TIME 6.'
  expected_verdict: REPRODUCED
  notes: RQ5 platform-specific differences.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"table7_values_matched": ([0-9]+)'
- metric: table5_counts_matched
  threshold: == 21
  unit: Table 5 count cells (of 21)
  source: Paper Table 5 (mobile OS used for locating settings) and Sec. 4.5 ("62% of participants use Android and 37% use iOS")
  measurement_protocol: Android / iOS / Others counts x (6 platforms + Total) from df_os (code cell 35).
  expected_verdict: REPRODUCED
  notes: The OS split behind the os row of Table 6.
  measure:
    file: amber-socialmedia/metrics.json
    regex: '"table5_counts_matched": ([0-9]+)'
